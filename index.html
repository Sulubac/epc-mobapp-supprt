const callAI = async (messages, system, maxTokens=1500) => {
  const key = getApiKey();
  if (!key) return "⚠️ Clé API non configurée. Allez dans Admin → Paramètres.";
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:maxTokens, system, messages })
    });
    const d = await r.json();
    if (d.content?.[0]) return d.content[0].text;
    if (d.error) return "❌ "+d.error.message;
    return "Service indisponible.";
  } catch(e) { return "❌ Erreur réseau: "+e.message; }
};

// QUIZ PARSER
// ═══════════════════════════════════════════
const parseQuiz = t => {
  const qs=[]; const rx=/\[QUIZ\]([\s\S]*?)\[\/QUIZ\]/g; let m;
  while((m=rx.exec(t))!==null){
    const b=m[1];
    const qM=b.match(/Q:\s*(.+)/); const os=[];
    for(const l of ["A","B","C","D"]){ const o=b.match(new RegExp(l+"\\)\\s*(.+)")); if(o) os.push(o[1].trim()); }
    const cM=b.match(/CORRECT:\s*([A-D])/); const eM=b.match(/EXPLICATION:\s*([\s\S]+?)$/m);
    if(qM&&os.length>=2&&cM) qs.push({q:qM[1].trim(),os,c:"ABCD".indexOf(cM[1]),ex:eM?eM[1].trim():""});
  }
  return qs;
};

const renderMd = t => {
  if(!t) return null;
  return t.replace(/\[QUIZ\][\s\S]*?\[\/QUIZ\]/g,"").trim().split("\n").map((l,i)=>{
    if(!l.trim()) return React.createElement("div",{key:i,style:{height:4}});
    let h=l.replace(/\*\*(.+?)\*\*/g,'<strong style="color:#fff">$1</strong>');
    h=h.replace(/\*(.+?)\*/g,'<em style="color:'+C.gold+'">$1</em>');
    if(l.startsWith("### ")) return React.createElement("div",{key:i,style:{fontSize:13,fontWeight:800,color:C.gold,margin:"8px 0 3px"}},l.slice(4));
    if(l.startsWith("## ")) return React.createElement("div",{key:i,style:{fontSize:14,fontWeight:800,margin:"8px 0 3px"}},l.slice(3));
    if(l.startsWith("# ")) return React.createElement("div",{key:i,style:{fontSize:15,fontWeight:800,fontFamily:FD,margin:"10px 0 4px"}},l.slice(2));
    if(l.startsWith("- ")||l.startsWith("• ")||l.startsWith("* ")) return React.createElement("div",{key:i,style:{paddingLeft:12,fontSize:12,color:"rgba(255,255,255,0.7)",lineHeight:1.7}},"• "+l.slice(2));
    if(l.startsWith("> ")) return React.createElement("div",{key:i,style:{borderLeft:"3px solid "+C.gold,paddingLeft:10,margin:"4px 0",fontSize:12,color:"rgba(255,255,255,0.6)"}},l.slice(2));
    if(/^\d+\./.test(l)) return React.createElement("div",{key:i,style:{paddingLeft:12,fontSize:12,color:"rgba(255,255,255,0.75)",lineHeight:1.7}},l);
    return React.createElement("p",{key:i,style:{fontSize:12,color:"rgba(255,255,255,0.72)",lineHeight:1.75,margin:"2px 0"},dangerouslySetInnerHTML:{__html:h}});
  });
};

  const savedGrades = db.grades?.[gradeKey]||{};
  const attKey = selCls+"::"+attDate;
  const savedAtt = db.attendance?.[attKey]||{};

  // Compute class stats
  const classAvg = () => {
    const g = Object.values(savedGrades).map(Number).filter(n=>!isNaN(n));
    return g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(1):null;
  };

  const saveGrades = () => {
    const updated = {...(db.grades||{}),[gradeKey]:{...(savedGrades||{}),...gradeInputs}};
    setDB(p=>({...p,grades:updated})); setGradeSaved(true); setTimeout(()=>setGradeSaved(false),2000);
  };

  const saveAttendance = () => {
    const updated = {...(db.attendance||{}),[attKey]:{...(savedAtt||{}),...attState}};
    setDB(p=>({...p,attendance:updated})); setAttSaved(true); setTimeout(()=>setAttSaved(false),2000);
  };

  const addChapter = () => {
    if(!newChap.trim()) return;
    const key=selCls+"::"+selSubj;
    const existing = getChapters(db,selCls,selSubj);
    if(existing.includes(newChap.trim())){setChapMsg("❌ Chapitre déjà existant");return;}
    setDB(p=>({...p,chapters:{...p.chapters,[key]:[...existing,newChap.trim()]}}));
    setNewChap(""); setChapMsg("✅ Chapitre ajouté");
    setTimeout(()=>setChapMsg(""),2000);
  };

  const addMaterial = () => {
    if(!selCls||!selSubj){setMatMsg("❌ Sélectionnez une classe et une matière");return;}
    if(!newMatTitle.trim()){setMatMsg("❌ Titre obligatoire");return;}
    const key=selCls+"::"+selSubj;
    const mat={id:Date.now()+"",title:newMatTitle.trim(),content:newMatContent.trim(),date:new Date().toLocaleDateString("fr-FR"),author:user.name};
    setDB(p=>({...p,materials:{...p.materials,[key]:[...(p.materials[key]||[]),mat]}}));
    setNewMatTitle("");setNewMatContent("");setShowMatForm(false);setMatMsg("✅ Cours ajouté !");
    setTimeout(()=>setMatMsg(""),2500);
  };
  const delMaterial = (key,id) => {
    setDB(p=>({...p,materials:{...p.materials,[key]:(p.materials[key]||[]).filter(m=>m.id!==id)}}));
  };

  const generateCourseWithAI = async (chapterName) => {
    if(!selCls||!selSubj){setMatMsg("❌ Sélectionnez une classe et une matière");return;}
    setAiGenLoading(true); setAiGenResult("");
    const lv=c2l(selCls);
    const sys=`Tu es ${BRAND_SHORT}, IA pédagogique d'une école d'excellence à Djibouti. Génère un cours complet, structuré et pédagogique en français pour des élèves de ${lv} en ${selSubj}. Le cours doit être clair, avec des exemples adaptés au contexte africain/djiboutien quand pertinent. Structure: Introduction, Définitions clés, Explication détaillée, Exemples résolus, Points à retenir, Exercices d'application.`;
    const r=await callAI([{role:"user",content:`Génère un cours complet sur "${chapterName}" pour la classe ${selCls} (niveau ${lv}) en ${selSubj}. Minimum 400 mots. Inclus des exercices pratiques.`}],sys,2500);
    setNewMatTitle(chapterName);
    setNewMatContent(r);
    setShowMatForm(true);
    setAiGenLoading(false);
    setAiGenResult("✅ Cours généré ! Vérifiez et publiez ci-dessus.");
    setTimeout(()=>setAiGenResult(""),3000);
  };

  const generateQuiz = async () => {
    setQuizLoading(true); setQuizResult("");
    const chapters=getChapters(db,selCls,selSubj);
    const chap=quizChap||chapters[0]||selSubj;
    const sys=`Tu es ${BRAND_SHORT}, IA pédagogique. Génère des questions de quiz en français pour des élèves. Niveau: ${c2l(selCls)}. Matière: ${selSubj}. Format strict:\n[QUIZ]\nQ: question\nA) opt1\nB) opt2\nC) opt3\nD) opt4\nCORRECT: B\nEXPLICATION: explication détaillée\n[/QUIZ]\nGénère exactement ${quizCount} questions de niveau ${quizDiff}.`;
    const r=await callAI([{role:"user",content:`Génère ${quizCount} questions ${quizDiff} sur "${chap}" pour ${selSubj} en ${c2l(selCls)}.`}],sys,2000);
    setQuizResult(r); setQuizLoading(false);
  };

  const correctHomework = async () => {
    if(!hwAnswer.trim()||!hwCorrect.trim()) return;
    setHwLoading(true); setHwResult("");
    const sys=`Tu es ${BRAND_SHORT}, correcteur pédagogique IA. Analyse la réponse d'un élève et fournis une correction constructive en français. Sois encourageant mais précis.`;
    const r=await callAI([{role:"user",content:`Matière: ${selSubj} | Classe: ${selCls}\nRéponse de l'élève:\n${hwAnswer}\n\nRéponse correcte/attendue:\n${hwCorrect}\n\nNote sur 20 et explique ce qui est juste et ce qui doit être amélioré.`}],sys,1000);
    setHwResult(r); setHwLoading(false);
  };

  const generateReport = async () => {
    const stu = allUsers.find(u=>u.id===reportStudent);
    if(!stu) return;
    setReportLoading(true); setReportResult("");
    const grades = {};
    Object.entries(db.grades||{}).forEach(([k,v])=>{ if(v[reportStudent]!==undefined){const subj=k.split("::")[1];grades[subj]=v[reportStudent];}});
    const att = Object.entries(db.attendance||{}).filter(([k])=>k.startsWith(stu.cls+"::")).map(([,v])=>v[reportStudent]);
    const attRate = att.length?Math.round(att.filter(s=>s==="present").length/att.length*100):null;
    const gradeStr=Object.entries(grades).map(([s,g])=>s+": "+g+"/20").join(", ")||"Pas de notes";
    const sys=`Tu es ${BRAND_SHORT}, IA rédacteur de bulletins scolaires. Rédige des commentaires de bulletin en français, professionnels et bienveillants. Inclus: appréciation générale, points forts, axes de progrès, encouragements.`;
    const r=await callAI([{role:"user",content:`Élève: ${stu.name} | Classe: ${stu.cls} | Année: ${db.year||"2025-2026"}\nNotes: ${gradeStr}\nTaux de présence: ${attRate!=null?attRate+"%":"N/A"}\n\nRédige le commentaire complet du bulletin (prof principal + appréciation générale).`}],sys,1000);
    setReportResult(r); setReportLoading(false);
  };

  const generateEarlyDetection = async () => {
    setEarlyLoading(true); setEarlyResult("");
    const students = studentsInClass;
    const sys=`Tu es ${BRAND_SHORT}, système de détection précoce des difficultés scolaires. Analyse les données et identifie les élèves à risque. IMPORTANT: tu fournis des indicateurs éducatifs uniquement, pas de diagnostic médical. Réponds en français avec des recommandations concrètes pour les enseignants.`;
    const studentData = students.map(s=>{
      const grades={};
      Object.entries(db.grades||{}).forEach(([k,v])=>{ if(v[s.id]!==undefined){const subj=k.split("::")[1];grades[subj]=v[s.id];}});
      const att=Object.entries(db.attendance||{}).filter(([k])=>k.startsWith(s.cls+"::")).map(([,v])=>v[s.id]);
      const attRate=att.length?Math.round(att.filter(x=>x==="present").length/att.length*100):null;
      const avg=Object.values(grades).length?(Object.values(grades).reduce((a,b)=>a+Number(b),0)/Object.values(grades).length).toFixed(1):null;
      return `${s.name}: moyenne=${avg||"N/A"}/20, présence=${attRate!=null?attRate+"%":"N/A"}, notes=${JSON.stringify(grades)||"{}"}`;
    }).join("\n");
    const r=await callAI([{role:"user",content:`Classe: ${selCls}\nDonnées élèves:\n${studentData}\n\nAnalyse et génère:\n1. Score de risque par élève (0-10)\n2. Indicateurs identifiés\n3. Plan d'intervention recommandé\n4. Message à envoyer aux parents concernés`}],sys,2000);
    setEarlyResult(r); setEarlyLoading(false);
  };

  const tabs = [{id:"home",ic:"🏠",lb:"Accueil"},{id:"cours",ic:"📚",lb:"Cours"},{id:"notes",ic:"📊",lb:"Notes"},{id:"presence",ic:"✅",lb:"Présence"},{id:"ia",ic:"🤖",lb:"IA Outils"}];

  return (
    <div style={{minHeight:"100dvh",background:"linear-gradient(170deg,"+C.bg+",#0a1020)",color:C.w}}>
      <Header t1={BRAND_SHORT+" — Enseignant"} t2={user.name+" • "+user.subject} onOut={onOut}/>
      <div style={{padding:"14px 16px 100px"}}>

        {/* Class + Subject selector (sticky context) */}
        {tab!=="home"&&<Card s={{marginBottom:12,padding:12}}>
          <div style={{display:"flex",gap:8}}>
            <div style={{flex:1}}>
              <Sel value={selCls} onChange={v=>{setSelCls(v);setSelSubj(CUR[c2l(v)]?.s[0]||user.subject||"");}} options={myClasses}/>
            </div>
            <div style={{flex:1}}>
              <Sel value={selSubj} onChange={setSelSubj} options={CUR[c2l(selCls)]?.s||[user.subject].filter(Boolean)}/>
            </div>
          </div>
          {(!selCls||!selSubj)&&<div style={{fontSize:10,color:C.amber,marginTop:4}}>⚠️ Sélectionnez une classe et une matière</div>}
        </Card>}

        {tab==="home"&&(
          <>
            <Card s={{background:"linear-gradient(135deg,"+C.amber+"15,"+C.orange+"10)",border:"1px solid "+C.amber+"30",marginBottom:14,padding:20}}>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:48,height:48,borderRadius:14,background:C.amber+"25",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>📚</div>
                <div><div style={{fontSize:16,fontWeight:800,fontFamily:FD}}>Bonjour, {user.name.split(" ")[0]} !</div><div style={{fontSize:11,color:C.m}}>{user.subject} • {myClasses.length} classes</div></div>
              </div>
            </Card>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
              <StatCard icon="👥" value={totalStudents} label="Mes élèves" color={C.blue}/>
              <StatCard icon="🏫" value={myClasses.length} label="Mes classes" color={C.amber}/>
            </div>
            <div style={{fontSize:13,fontWeight:800,marginBottom:10}}>🏫 Mes Classes</div>
            {myClasses.map(cls=>{
              const stu=allUsers.filter(u=>u.role==="student"&&u.cls===cls);
              return <Card key={cls} s={{marginBottom:8,display:"flex",alignItems:"center",gap:10,padding:13}}>
                <div style={{width:36,height:36,borderRadius:9,background:C.amber+"18",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13}}>{stu.length}</div>
                <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{cls}</div><div style={{fontSize:10,color:C.m}}>{c2l(cls)} • {stu.length} élèves</div></div>
              </Card>;
            })}
            <div style={{fontSize:13,fontWeight:800,marginBottom:8,marginTop:16}}>🤖 Modules IA disponibles</div>
            <Card onClick={()=>setTab("ia")||setAiTab("detect")} s={{marginBottom:8,display:"flex",alignItems:"center",gap:10,padding:13,background:C.red+"08",border:"1px solid "+C.red+"20",cursor:"pointer"}}>
              <span style={{fontSize:22}}>🔍</span>
              <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:C.red}}>Détection Précoce des Difficultés</div><div style={{fontSize:10,color:C.m}}>Score de risque • alertes • plan d'intervention</div></div>
              <span style={{color:C.m}}>→</span>
            </Card>
            <Card onClick={()=>setTab("ia")||setAiTab("quiz")} s={{marginBottom:8,display:"flex",alignItems:"center",gap:10,padding:13,background:C.primary+"08",border:"1px solid "+C.primary+"20",cursor:"pointer"}}>
              <span style={{fontSize:22}}>✨</span>
              <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:C.primary}}>Générateur de Quiz IA</div><div style={{fontSize:10,color:C.m}}>Quiz adaptatifs • correction automatique • bulletins</div></div>
              <span style={{color:C.m}}>→</span>
            </Card>
          </>
        )}

        {tab==="cours"&&(
          <>
            <div style={{fontSize:14,fontWeight:800,fontFamily:FD,marginBottom:4}}>📚 Gestion des Cours — {selCls}</div>
            {(!selCls||!selSubj)&&<Card s={{background:C.amber+"0a",border:"1px solid "+C.amber+"25",padding:14,marginBottom:12}}><div style={{fontSize:11,color:C.amber}}>⚠️ Sélectionnez une classe et une matière ci-dessus pour gérer les cours.</div></Card>}

            {/* Course Materials section — PROMINENT */}
            {selCls&&selSubj&&<>
            <Card s={{marginBottom:12,background:C.blue+"08",border:"1.5px solid "+C.blue+"30",padding:14}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:matMsg?8:showMatForm?10:0}}>
                <div>
                  <div style={{fontSize:13,fontWeight:800,color:C.blue}}>📄 Cours publiés — {selSubj}</div>
                  <div style={{fontSize:10,color:C.m,marginTop:2}}>{(db.materials?.[selCls+"::"+selSubj]||[]).length} cours • {selCls}</div>
                </div>
                <button onClick={()=>setShowMatForm(!showMatForm)} style={{padding:"8px 16px",borderRadius:9,border:"none",background:showMatForm?"rgba(255,255,255,0.08)":C.blue,color:C.w,fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0}}>
                  {showMatForm?"✕ Annuler":"+ Nouveau cours"}
                </button>
              </div>
              {matMsg&&<div style={{fontSize:11,color:matMsg[0]==="✅"?C.green:C.red,marginBottom:8}}>{matMsg}</div>}
              {showMatForm&&(
                <div style={{marginTop:10,padding:12,borderRadius:10,background:"rgba(0,0,0,0.2)",border:"1px solid "+C.border}}>
                  <Inp label="Titre du cours *" value={newMatTitle} onChange={setNewMatTitle} ph="Ex: Leçon 1 — Les nombres relatifs"/>
                  <div style={{marginBottom:8}}>
                    <Btn onClick={()=>newMatTitle.trim()&&generateCourseWithAI(newMatTitle.trim())} color={C.purple} full s={{marginBottom:6,opacity:aiGenLoading?0.7:1}}>
                      {aiGenLoading?"⏳ Génération en cours...":"🤖 Générer le contenu avec Claude IA"}
                    </Btn>
                    {!newMatTitle.trim()&&<div style={{fontSize:9,color:C.amber,textAlign:"center"}}>Saisissez d'abord le titre du cours</div>}
                    {aiGenResult&&<div style={{fontSize:10,color:C.green,textAlign:"center",marginTop:4}}>{aiGenResult}</div>}
                  </div>
                  <Textarea label="Contenu (leçon, exercices, ressources...)" value={newMatContent} onChange={setNewMatContent} ph="Rédigez le contenu ou cliquez 'Générer avec Claude IA' ci-dessus pour auto-générer..." rows={8}/>
                  <Btn onClick={addMaterial} color={C.blue} full>💾 Publier le cours</Btn>
                </div>
              )}
            </Card>
            {(db.materials?.[selCls+"::"+selSubj]||[]).length===0&&!showMatForm&&(
              <Card s={{textAlign:"center",padding:24,color:C.m,marginBottom:12,border:"1.5px dashed "+C.border}}><div style={{fontSize:32,marginBottom:8}}>📄</div><div style={{fontSize:12,marginBottom:10}}>Aucun cours publié pour {selSubj}</div><Btn onClick={()=>setShowMatForm(true)} color={C.blue} s={{fontSize:11}}>+ Publier le premier cours</Btn></Card>
            )}
            {matView&&(
              <Card s={{marginBottom:10,background:C.blue+"06",border:"1px solid "+C.blue+"25",padding:14}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                  <div style={{fontSize:13,fontWeight:800}}>{matView.title}</div>
                  <button onClick={()=>setMatView(null)} style={{background:"none",border:"none",color:C.m,cursor:"pointer",fontSize:14}}>✕</button>
                </div>
                <div style={{fontSize:10,color:C.m,marginBottom:10}}>{matView.date} • {matView.author}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.8)",lineHeight:1.8,whiteSpace:"pre-wrap"}}>{matView.content||"(Aucun contenu)"}</div>
              </Card>
            )}
            {(db.materials?.[selCls+"::"+selSubj]||[]).map((m,i)=>(
              <Card key={m.id} s={{marginBottom:6,padding:12}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:32,height:32,borderRadius:8,background:C.blue+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>📄</div>
                  <div style={{flex:1,cursor:"pointer"}} onClick={()=>setMatView(matView?.id===m.id?null:m)}>
                    <div style={{fontSize:12,fontWeight:700}}>{m.title}</div>
                    <div style={{fontSize:9,color:C.m}}>{m.date} • {m.author}</div>
                  </div>
                  <div style={{display:"flex",gap:5}}>
                    <button onClick={()=>setMatView(matView?.id===m.id?null:m)} style={{padding:"4px 9px",borderRadius:6,border:"1px solid "+C.blue+"30",background:C.blue+"10",color:C.blue,fontSize:9,fontWeight:700,cursor:"pointer"}}>👁 Voir</button>
                    <button onClick={()=>delMaterial(selCls+"::"+selSubj,m.id)} style={{padding:"4px 9px",borderRadius:6,border:"1px solid "+C.red+"30",background:C.red+"10",color:C.red,fontSize:9,fontWeight:700,cursor:"pointer"}}>🗑</button>
                  </div>
                </div>
              </Card>
            ))}

            {/* Chapters section */}
            <div style={{fontSize:11,fontWeight:800,color:C.m,marginBottom:8,marginTop:8,textTransform:"uppercase",letterSpacing:0.5}}>📖 Chapitres du programme</div>
            {aiGenLoading&&<Card s={{padding:14,marginBottom:8,background:C.purple+"10",border:"1px solid "+C.purple+"30",textAlign:"center"}}><div style={{fontSize:12,color:C.purple}}>⏳ Claude génère le cours pour vous...</div></Card>}
            {getChapters(db,selCls,selSubj).map((ch,i)=>(
              <Card key={i} s={{marginBottom:5,display:"flex",alignItems:"center",gap:10,padding:11}}>
                <div style={{width:26,height:26,borderRadius:7,background:C.green+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:C.green}}>{i+1}</div>
                <span style={{flex:1,fontSize:12,fontWeight:600}}>{ch}</span>
                <button onClick={()=>generateCourseWithAI(ch)} disabled={aiGenLoading} style={{padding:"4px 9px",borderRadius:7,border:"1px solid "+C.purple+"40",background:C.purple+"12",color:C.purple,fontSize:9,fontWeight:700,cursor:"pointer",flexShrink:0}}>🤖 Générer</button>
              </Card>
            ))}
            <Card s={{marginBottom:14,padding:13}}>
              <div style={{fontSize:11,fontWeight:800,marginBottom:7}}>➕ Ajouter un chapitre</div>
              <div style={{display:"flex",gap:7}}>
                <input value={newChap} onChange={e=>setNewChap(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addChapter()} placeholder="Nom du chapitre" style={{flex:1,padding:"9px 11px",borderRadius:8,border:"1.5px solid "+C.border,background:"rgba(255,255,255,0.04)",color:C.w,fontSize:12,outline:"none"}}/>
                <Btn onClick={addChapter} color={C.green} s={{fontSize:11,padding:"9px 14px"}}>+</Btn>
              </div>
              {chapMsg&&<div style={{fontSize:11,color:chapMsg[0]==="✅"?C.green:C.red,marginTop:5}}>{chapMsg}</div>}
            </Card>
            </>}
          </>
        )}

        {tab==="notes"&&(
          <>
            <div style={{fontSize:14,fontWeight:800,fontFamily:FD,marginBottom:4}}>📊 Carnet de Notes</div>
            {classAvg()&&<Card s={{marginBottom:12,background:C.green+"0a",border:"1px solid "+C.green+"20",padding:12,textAlign:"center"}}><span style={{fontSize:14,fontWeight:800,color:C.green}}>Moyenne classe: {classAvg()}/20</span></Card>}
            <div style={{fontSize:11,color:C.m,marginBottom:10}}>{selSubj} • {selCls} • {studentsInClass.length} élèves</div>
            {studentsInClass.length===0&&<Card s={{textAlign:"center",padding:24,color:C.m}}>Aucun élève dans cette classe</Card>}
            {studentsInClass.map(s=>{
              const cur=gradeInputs[s.id]!==undefined?gradeInputs[s.id]:savedGrades[s.id]!==undefined?String(savedGrades[s.id]):"";
              const gNum=Number(cur);
              const gc=!cur?"":gNum>=14?C.green:gNum>=10?C.amber:C.red;
              return (
                <Card key={s.id} s={{marginBottom:6,display:"flex",alignItems:"center",gap:10,padding:12}}>
                  <div style={{width:34,height:34,borderRadius:8,background:C.amber+"18",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13}}>{(s.name||"?")[0]}</div>
                  <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700}}>{s.name}</div><div style={{fontSize:9,color:C.d}}>{s.id}</div></div>
                  <input value={cur} onChange={e=>{const v=e.target.value;setGradeInputs(p=>({...p,[s.id]:v}));}} placeholder="/20" type="number" min="0" max="20" step="0.5"
                    style={{width:60,padding:"7px 8px",borderRadius:8,border:"1.5px solid "+(gc||C.border),background:"rgba(255,255,255,0.04)",color:gc||C.w,fontSize:13,fontWeight:700,outline:"none",textAlign:"center"}}/>
                </Card>
              );
            })}
            {studentsInClass.length>0&&<div style={{marginTop:12,display:"flex",gap:8,alignItems:"center"}}>
              <Btn onClick={saveGrades} color={C.green}>💾 Sauvegarder les notes</Btn>
              {gradeSaved&&<span style={{fontSize:11,color:C.green}}>✅ Sauvegardé !</span>}
            </div>}
          </>
        )}

        {tab==="presence"&&(
          <>
            <div style={{fontSize:14,fontWeight:800,fontFamily:FD,marginBottom:4}}>✅ Feuille de Présence</div>
            <div style={{marginBottom:12}}>
              <Inp label="Date" value={attDate} onChange={setAttDate} type="date"/>
            </div>
            <div style={{fontSize:11,color:C.m,marginBottom:10}}>{selCls} • {studentsInClass.length} élèves</div>
            {studentsInClass.length===0&&<Card s={{textAlign:"center",padding:24,color:C.m}}>Aucun élève dans cette classe</Card>}
            {studentsInClass.map(s=>{
              const cur=attState[s.id]||savedAtt[s.id]||"present";
              const colors={present:C.green,absent:C.red,late:C.amber};
              return (
                <Card key={s.id} s={{marginBottom:6,display:"flex",alignItems:"center",gap:10,padding:12}}>
                  <div style={{width:34,height:34,borderRadius:8,background:colors[cur]+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>{cur==="present"?"✅":cur==="absent"?"❌":"⏰"}</div>
                  <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700}}>{s.name}</div></div>
                  <div style={{display:"flex",gap:4}}>
                    {["present","absent","late"].map(st=>(
                      <button key={st} onClick={()=>setAttState(p=>({...p,[s.id]:st}))} style={{padding:"5px 10px",borderRadius:7,border:"1px solid "+(cur===st?colors[st]:C.border),background:cur===st?colors[st]+"20":"transparent",color:cur===st?colors[st]:C.m,fontSize:9,fontWeight:700,cursor:"pointer"}}>
                        {st==="present"?"✅ Prés":st==="absent"?"❌ Abs":"⏰ Tard"}
                      </button>
                    ))}
                  </div>
                </Card>
              );
            })}

const ProgrammesTab = ({db, setDB}) => {
  const [progCls,setProgCls] = useState((db.classes||[])[0]||"");
  const [newSubj,setNewSubj] = useState("");
  const [progMsg,setProgMsg] = useState("");
  const [selProgSubj,setSelProgSubj] = useState("");
  const [showAddMat,setShowAddMat] = useState(false);
  const [matTitle,setMatTitle] = useState("");
  const [matContent,setMatContent] = useState("");
  const [matMsg,setMatMsg] = useState("");
  const [progAiLoading,setProgAiLoading] = useState(false);

  const generateProgCourse = async (ch) => {
    if(!selProgSubj){return;}
    setProgAiLoading(true);
    const lv=c2l(progCls);
    const sys=`Tu es ${BRAND_SHORT}, IA pédagogique d'une école d'excellence à Djibouti. Génère un cours complet et structuré en français pour des élèves de ${lv} en ${selProgSubj}. Structure: 🎯 Objectifs, 📚 Cours, 💡 Exemples, ✏️ Exercices corrigés (3), 📝 Résumé. Adapte au contexte africain/djiboutien quand pertinent.`;
    const r = await callAI([{role:"user",content:`Génère un cours complet sur "${ch}" pour ${selProgSubj} — ${progCls} (${lv}). Minimum 400 mots.`}],sys,2500);
    setMatTitle(ch);
    setMatContent(r);
    setShowAddMat(true);
    setProgAiLoading(false);
  };
  const lv = c2l(progCls);
  const defSubjs = CUR[lv]?.s||[];
  const customSubjs = db.chapters ? Object.keys(db.chapters).filter(k=>k.startsWith(progCls+"::")).map(k=>k.split("::")[1]) : [];
  const allSubjs = [...new Set([...defSubjs,...customSubjs])];
  const unusedSubjs = SUB_LIST.filter(s=>!defSubjs.includes(s)&&!customSubjs.includes(s));
  const addSubjToClass = () => {
    if(!newSubj.trim()){setProgMsg("❌ Sélectionner une matière");return;}
    const key=progCls+"::"+newSubj;
    if(!(db.chapters||{})[key]){setDB(p=>({...p,chapters:{...p.chapters,[key]:DEF_CHAPTERS[newSubj]||["Chapitre 1","Chapitre 2","Chapitre 3"]}}));}
    setNewSubj("");setProgMsg("✅ Matière ajoutée !");setTimeout(()=>setProgMsg(""),2500);
  };
  const addCourseMaterial = () => {
    if(!selProgSubj){setMatMsg("❌ Sélectionnez une matière");return;}
    if(!matTitle.trim()){setMatMsg("❌ Titre obligatoire");return;}
    const key=progCls+"::"+selProgSubj;
    const mat={id:Date.now()+"",title:matTitle.trim(),content:matContent.trim(),date:new Date().toLocaleDateString("fr-FR"),author:"Administration"};
    setDB(p=>({...p,materials:{...p.materials,[key]:[...(p.materials?.[key]||[]),mat]}}));
    setMatTitle("");setMatContent("");setShowAddMat(false);setMatMsg("✅ Cours publié !");setTimeout(()=>setMatMsg(""),2500);
  };
  const delMat = (key,id) => setDB(p=>({...p,materials:{...p.materials,[key]:(p.materials?.[key]||[]).filter(m=>m.id!==id)}}));
  return (
    <div>
      <div style={{fontSize:14,fontWeight:800,fontFamily:FD,marginBottom:12}}>📋 Gestion des Programmes</div>
      <Sel label="Sélectionner la classe" value={progCls} onChange={v=>{setProgCls(v);setSelProgSubj("");setShowAddMat(false);}} options={db.classes||[]}/>
      {progCls&&<>
        <Card s={{marginBottom:12,background:C.primary+"08",border:"1px solid "+C.primary+"20",padding:14}}>
          <div style={{fontSize:13,fontWeight:800,marginBottom:2}}>{progCls} — Niveau: {lv}</div>
          <div style={{fontSize:10,color:C.m,marginBottom:10}}>Programme officiel + matières personnalisées ({allSubjs.length} matières)</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
            {allSubjs.map(s=>(
              <span key={s} onClick={()=>{setSelProgSubj(s);setShowAddMat(false);}} style={{padding:"5px 12px",borderRadius:8,background:selProgSubj===s?C.primary+"30":defSubjs.includes(s)?C.primary+"12":C.green+"12",border:"1px solid "+(selProgSubj===s?C.primary:defSubjs.includes(s)?C.primary:C.green)+"40",color:selProgSubj===s?C.w:defSubjs.includes(s)?C.primary:C.green,fontSize:10,fontWeight:700,cursor:"pointer"}}>{s}</span>
            ))}
          </div>
          <div style={{fontSize:9,color:C.d}}>🔵 Programme officiel • 🟢 Ajouté manuellement</div>
        </Card>
        {selProgSubj&&<Card s={{marginBottom:12,background:C.blue+"07",border:"1px solid "+C.blue+"20",padding:14}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontSize:12,fontWeight:800}}>📚 {selProgSubj}</div>
            <button onClick={()=>setShowAddMat(!showAddMat)} style={{padding:"5px 12px",borderRadius:7,border:"1px solid "+C.blue+"40",background:C.blue+"12",color:C.blue,fontSize:10,fontWeight:700,cursor:"pointer"}}>{showAddMat?"✕ Annuler":"+ Ajouter un cours"}</button>
          </div>
          {matMsg&&<div style={{fontSize:11,color:matMsg[0]==="✅"?C.green:C.red,marginBottom:8}}>{matMsg}</div>}
          {showAddMat&&<div style={{marginBottom:12,padding:12,borderRadius:10,background:"rgba(0,0,0,0.15)",border:"1px solid "+C.border}}>
            <Inp label="Titre du cours *" value={matTitle} onChange={setMatTitle} ph="Ex: Introduction au chapitre 1"/>
            <div style={{marginBottom:8}}>
              <Btn onClick={()=>matTitle.trim()&&generateProgCourse(matTitle.trim())} color={C.purple} full s={{marginBottom:4,opacity:progAiLoading?0.7:1}}>
                {progAiLoading?"⏳ Claude génère...":"🤖 Générer le contenu avec Claude IA"}
              </Btn>
            </div>
            <Textarea label="Contenu du cours" value={matContent} onChange={setMatContent} ph="Rédigez le contenu ou générez-le avec l'IA ci-dessus..." rows={6}/>
            <Btn onClick={addCourseMaterial} color={C.blue} s={{fontSize:11}}>💾 Publier le cours</Btn>
          </div>}
          <div style={{fontSize:10,fontWeight:800,color:C.m,marginBottom:6,textTransform:"uppercase"}}>Cours publiés ({(db.materials?.[progCls+"::"+selProgSubj]||[]).length})</div>
          {(db.materials?.[progCls+"::"+selProgSubj]||[]).length===0&&<div style={{fontSize:11,color:C.d,padding:"8px 0"}}>Aucun cours publié pour cette matière</div>}
          {(db.materials?.[progCls+"::"+selProgSubj]||[]).map(m=>(
            <div key={m.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid "+C.border+"30"}}>
              <span style={{fontSize:13}}>📄</span>
              <div style={{flex:1}}><div style={{fontSize:11,fontWeight:600}}>{m.title}</div><div style={{fontSize:9,color:C.m}}>{m.date} • {m.author}</div></div>
              <button onClick={()=>delMat(progCls+"::"+selProgSubj,m.id)} style={{padding:"3px 8px",borderRadius:5,border:"1px solid "+C.red+"30",background:C.red+"10",color:C.red,fontSize:9,cursor:"pointer"}}>🗑</button>
            </div>
          ))}
          <div style={{marginTop:10,fontSize:10,fontWeight:800,color:C.m,marginBottom:6,textTransform:"uppercase"}}>Chapitres du programme</div>
          {progAiLoading&&<div style={{padding:"8px 10px",fontSize:10,color:C.purple,background:C.purple+"0a",borderRadius:7,marginBottom:6}}>⏳ Claude génère le cours...</div>}
          {getChapters(db,progCls,selProgSubj).map((ch,j)=>(
            <div key={j} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid "+C.border+"30"}}>
              <span style={{fontSize:10,fontWeight:700,color:C.primary,minWidth:18}}>{j+1}.</span>
              <span style={{fontSize:11,flex:1,color:C.d}}>{ch}</span>
              <button onClick={()=>generateProgCourse(ch)} disabled={progAiLoading} style={{padding:"3px 8px",borderRadius:5,border:"1px solid "+C.purple+"40",background:C.purple+"10",color:C.purple,fontSize:8,fontWeight:700,cursor:"pointer",flexShrink:0}}>🤖 Générer</button>
            </div>
          ))}
        </Card>}
        {!selProgSubj&&<Card s={{textAlign:"center",padding:20,color:C.m,marginBottom:12}}><div style={{fontSize:24,marginBottom:6}}>👆</div><div style={{fontSize:11}}>Cliquez sur une matière ci-dessus pour gérer ses cours</div></Card>}
        {unusedSubjs.length>0&&<Card s={{padding:13}}>
          <div style={{fontSize:11,fontWeight:800,marginBottom:8}}>➕ Ajouter une matière supplémentaire</div>
          <Sel value={newSubj} onChange={setNewSubj} options={unusedSubjs}/>
          {progMsg&&<div style={{fontSize:11,color:progMsg[0]==="✅"?C.green:C.red,marginBottom:8}}>{progMsg}</div>}
          <Btn onClick={addSubjToClass} color={C.green} s={{fontSize:11}}>+ Ajouter au programme</Btn>
        </Card>}
      </>}
    </div>
  );
};

// ADMIN PORTAL

const AdminPortal = ({user, db, setDB, onOut}) => {
  const [tab,setTab] = useState("home");
  const [subTab,setSubTab] = useState("classes");
  // User management
  const [cMode,setCMode] = useState(null); // "student"|"parent"|"teacher"|"admin"|null
  const [editId,setEditId] = useState(null);
  const [form,setForm] = useState({});
  const [formMsg,setFormMsg] = useState("");
  const [showPw,setShowPw] = useState(false);
  const [delConfirm,setDelConfirm] = useState(null);
  const [search,setSearch] = useState("");
  const [roleFilter,setRoleFilter] = useState("all");
  // Class mgmt
  const [newClass,setNewClass] = useState("");
  const [classMsg,setClassMsg] = useState("");
  // Communication
  const [annTitle,setAnnTitle] = useState("");
  const [annBody,setAnnBody] = useState("");
  const [annTarget,setAnnTarget] = useState("all");
  const [annSent,setAnnSent] = useState(false);
  // Finance
  const [finChild,setFinChild] = useState("");
  const [finAmount,setFinAmount] = useState("");
  const [finMonth,setFinMonth] = useState("");
  const [finMsg,setFinMsg] = useState("");
  // Analytics
  const [analyticsResult,setAnalyticsResult] = useState("");
  const [analyticsLoading,setAnalyticsLoading] = useState(false);
  // Settings
  const [schoolName,setSchoolName] = useState(db.schoolName||"Nouvelle École Champion");
  const [yearSetting,setYearSetting] = useState(db.year||"2025-2026");

  const allUsers = Object.entries(db.users).map(([id,u])=>({id,...u}));
  const students = allUsers.filter(u=>u.role==="student");
  const parents = allUsers.filter(u=>u.role==="parent");
  const teachers = allUsers.filter(u=>u.role==="teacher");
  const admins = allUsers.filter(u=>u.role==="admin");
  const filtered = allUsers.filter(u=>{
    if(roleFilter!=="all"&&u.role!==roleFilter) return false;
    if(search&&!(u.name||"").toLowerCase().includes(search.toLowerCase())&&!u.id.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  const studentsInClass = cls => students.filter(s=>s.cls===cls);

  const startCreate = role => {
    const id=genId(db.users,role);
    const base={id,pw:"",name:"",role};
    if(role==="student") Object.assign(base,{cls:"",parentId:"",dob:"",gender:""});
    if(role==="parent") Object.assign(base,{childIds:[]});
    if(role==="teacher") Object.assign(base,{subject:"",classes:[]});
    setForm(base); setCMode(role); setEditId(null); setFormMsg("");
  };
  const startEdit = u => { setForm({...u}); setEditId(u.id); setCMode(null); setFormMsg(""); setDelConfirm(null); };

  const saveUser = () => {
    const d=form;
    if(!(d.name||"").trim()){setFormMsg("❌ Nom obligatoire");return;}
    if(!(d.pw||"").trim()||d.pw.length<4){setFormMsg("❌ Mot de passe min 4 caractères");return;}
    if(d.role==="student"&&!d.cls){setFormMsg("❌ Classe obligatoire");return;}
    if(d.role==="teacher"&&!d.subject){setFormMsg("❌ Matière obligatoire");return;}
    if(d.role==="teacher"&&(!d.classes||!d.classes.length)){setFormMsg("❌ Sélectionner au moins 1 classe");return;}
    const nu={...db.users};
    const ud={pw:d.pw.trim(),role:d.role,name:d.name.trim()};
    if(d.role==="student"){ud.cls=d.cls;ud.parentId=d.parentId||"";ud.dob=d.dob||"";ud.gender=d.gender||"";
      if(d.parentId&&nu[d.parentId]){const pr={...nu[d.parentId]};if(!pr.childIds)pr.childIds=[];if(!pr.childIds.includes(d.id))pr.childIds=[...pr.childIds,d.id];nu[d.parentId]=pr;}
      if(editId){const old=(db.users[d.id]||{}).parentId;if(old&&old!==d.parentId&&nu[old])nu[old]={...nu[old],childIds:(nu[old].childIds||[]).filter(c=>c!==d.id)};}}
    if(d.role==="parent"){ud.childIds=d.childIds||[];(d.childIds||[]).forEach(c=>{if(nu[c])nu[c]={...nu[c],parentId:d.id};});}
    if(d.role==="teacher"){ud.subject=d.subject;ud.classes=d.classes||[];}
    nu[d.id]=ud;
    setDB(p=>({...p,users:nu}));
    setFormMsg("✅ "+(cMode?"Créé":"Modifié")+": "+d.name+" ("+d.id+")");
    setCMode(null); setEditId(null);
  };

  const deleteUser = id => {
    if(id===user.uid){setFormMsg("❌ Impossible de supprimer votre propre compte");return;}
    const u=db.users[id]; const nu={...db.users};
    if(u.role==="student"&&u.parentId&&nu[u.parentId])nu[u.parentId]={...nu[u.parentId],childIds:(nu[u.parentId].childIds||[]).filter(c=>c!==id)};
    if(u.role==="parent")(u.childIds||[]).forEach(c=>{if(nu[c])nu[c]={...nu[c],parentId:""};});
    delete nu[id]; setDB(p=>({...p,users:nu})); setFormMsg("🗑️ Supprimé"); setEditId(null); setDelConfirm(null);
  };

  const addClass = () => {
    if(!newClass.trim()){setClassMsg("❌ Nom vide");return;}
    if((db.classes||[]).includes(newClass.trim())){setClassMsg("❌ Classe déjà existante");return;}
    setDB(p=>({...p,classes:[...p.classes,newClass.trim()]}));setNewClass("");setClassMsg("✅ Classe créée");setTimeout(()=>setClassMsg(""),2000);
  };
  const removeClass = cls => {
    if(studentsInClass(cls).length){setClassMsg("❌ Impossible: "+studentsInClass(cls).length+" élève(s) dans cette classe");return;}
    setDB(p=>({...p,classes:p.classes.filter(c=>c!==cls)}));setClassMsg("🗑️ Classe supprimée");setTimeout(()=>setClassMsg(""),2000);
  };

  const sendAnnouncement = () => {
    if(!annTitle.trim()||!annBody.trim()) return;
    const ann={id:Date.now()+"",title:annTitle.trim(),body:annBody.trim(),target:annTarget,date:new Date().toLocaleDateString("fr-FR"),from:user.name};
    setDB(p=>({...p,announcements:[...(p.announcements||[]),ann]}));
    setAnnTitle(""); setAnnBody(""); setAnnSent(true); setTimeout(()=>setAnnSent(false),3000);
  };

  const savePayment = () => {
    if(!finChild||!finAmount||!finMonth){setFinMsg("❌ Tous les champs sont requis");return;}
    const payment={date:new Date().toLocaleDateString("fr-FR"),amount:Number(finAmount),month:finMonth};
    const existing=db.finance?.[finChild]||{monthlyFee:15000,payments:[]};
    setDB(p=>({...p,finance:{...(p.finance||{}),[finChild]:{...existing,payments:[...existing.payments,payment]}}}));
    setFinChild(""); setFinAmount(""); setFinMonth(""); setFinMsg("✅ Paiement enregistré !");
    setTimeout(()=>setFinMsg(""),3000);
  };

  const generateAnalytics = async () => {
    setAnalyticsLoading(true); setAnalyticsResult("");
    const totalGrades=Object.values(db.grades||{}).flatMap(g=>Object.values(g)).map(Number).filter(n=>!isNaN(n));
    const overallAvg=totalGrades.length?(totalGrades.reduce((a,b)=>a+b,0)/totalGrades.length).toFixed(1):null;
    const attRecords=Object.values(db.attendance||{}).flatMap(r=>Object.values(r));
    const attRate=attRecords.length?Math.round(attRecords.filter(s=>s==="present").length/attRecords.length*100):null;
    const sys=`Tu es ${BRAND_SHORT}, IA d'analyse scolaire. Tu analyses des données d'établissement et fournis des insights actionnables en français. Sois précis, structuré, et orienté solutions.`;
    const r=await callAI([{role:"user",content:`École: ${db.schoolName||"ÉcoleAI"} | Année: ${db.year||"2025-2026"}
Effectifs: ${students.length} élèves, ${teachers.length} enseignants, ${(db.classes||[]).length} classes
Moyenne générale école: ${overallAvg||"N/A"}/20
Taux de présence moyen: ${attRate!=null?attRate+"%":"N/A"}
Paiements collectés: ${Object.values(db.finance||{}).reduce((a,f)=>(f.payments||[]).reduce((b,p)=>b+Number(p.amount),0)+a,0).toLocaleString()} FDJ

Génère une analyse complète incluant:
1. 📊 Tableau de bord performance globale
2. ⚠️ Alertes et points d'attention
3. 🎯 Recommandations prioritaires
4. 📈 Tendances identifiées
5. 🔮 Prévisions pour le trimestre`}],sys,2000);
    setAnalyticsResult(r); setAnalyticsLoading(false);
  };

  const saveSettings = () => {
    setDB(p=>({...p,schoolName:schoolName.trim(),year:yearSetting.trim()}));
    alert("✅ Paramètres sauvegardés !");
  };

  const rColor = r=>r==="student"?C.blue:r==="parent"?C.purple:r==="teacher"?C.amber:C.green;
  const rIcon = r=>r==="student"?"🎓":r==="parent"?"👨‍👩‍👧":r==="teacher"?"📚":"🏫";
  const rLabel = r=>r==="student"?"Élève":r==="parent"?"Parent":r==="teacher"?"Enseignant":"Admin";

  const tabs = [{id:"home",ic:"📊",lb:"Tableau"},{id:"users",ic:"👥",lb:"Utilisateurs"},{id:"ia",ic:"🤖",lb:"Modules IA"},{id:"finance",ic:"💰",lb:"Finance"},{id:"more",ic:"⋯",lb:"Plus"}];

  // User form
  if(cMode||editId) return (
    <div style={{minHeight:"100dvh",background:"linear-gradient(170deg,"+C.bg+",#0a1020)",color:C.w}}>
      <Header t1={BRAND_SHORT+" — Admin"} t2={user.name} onOut={onOut}/>

// EARLY DETECTION MODULE (AI) — ENHANCED
// ═══════════════════════════════════════════
const EarlyDetectionModule = ({db, cls, allUsers}) => {
  const [mode,setMode] = useState("dashboard");
  const [selStu,setSelStu] = useState("");
  const [obsText,setObsText] = useState("");
  const [analysis,setAnalysis] = useState(null);
  const [loading,setLoading] = useState(false);
  const [reportResult,setReportResult] = useState("");

  const students = allUsers.filter(u=>u.role==="student"&&u.cls===cls);

  const getRisk = (s) => {
    const grades={};
    Object.entries(db.grades||{}).forEach(([k,v])=>{if(v[s.id]!==undefined){const subj=k.split("::")[1];grades[subj]=Number(v[s.id]);}});
    const gv=Object.values(grades); const avg=gv.length?(gv.reduce((a,b)=>a+b,0)/gv.length):null;
    const att=Object.entries(db.attendance||{}).filter(([k])=>k.startsWith(s.cls+"::")).map(([,v])=>v[s.id]);
    const absences=att.filter(x=>x==="absent").length; const late=att.filter(x=>x==="late").length;
    const attRate=att.length?Math.round(att.filter(x=>x==="present").length/att.length*100):null;
    const risks=[];
    if(avg!==null&&avg<8) risks.push({cat:"Académique",d:"Moyenne critique: "+avg.toFixed(1)+"/20",sev:"high"});
    else if(avg!==null&&avg<10) risks.push({cat:"Académique",d:"Moyenne insuffisante: "+avg.toFixed(1)+"/20",sev:"medium"});
    if(attRate!==null&&attRate<70) risks.push({cat:"Absentéisme",d:absences+" absences — "+attRate+"% présence",sev:"high"});
    else if(attRate!==null&&attRate<85) risks.push({cat:"Présence",d:attRate+"% de présence",sev:"medium"});
    if(late>=5) risks.push({cat:"Ponctualité",d:late+" retards enregistrés",sev:"medium"});
    const lowS=Object.entries(grades).filter(([,g])=>g<8).map(([s])=>s);
    if(lowS.length>=3) risks.push({cat:"Difficultés multiples",d:"Faible en: "+lowS.slice(0,3).join(", "),sev:"high"});
    const score=Math.min(10,risks.filter(r=>r.sev==="high").length*3+risks.filter(r=>r.sev==="medium").length*1.5);
    return {avg,attRate,absences,late,grades,risks,score:Math.round(score*10)/10};
  };

  const sc = s=>s>=7?C.red:s>=4?C.amber:C.green;

  const analyzeStudent = async () => {
    const s=students.find(x=>x.id===selStu); if(!s) return;
    setLoading(true); setAnalysis(null);
    const rd=getRisk(s);
    const sys=`Tu es ${BRAND_SHORT}, système de détection précoce des difficultés scolaires. IMPORTANT: indicateurs éducatifs UNIQUEMENT — aucun diagnostic médical. Réponds en français avec bienveillance et précision.`;
    const r=await callAI([{role:"user",content:`Élève: ${s.name} | Classe: ${s.cls} | Niveau: ${c2l(s.cls)}
Moyenne: ${rd.avg?.toFixed(1)||"N/A"}/20 | Présence: ${rd.attRate!=null?rd.attRate+"%":"N/A"} | Absences: ${rd.absences} | Retards: ${rd.late}
Notes: ${Object.entries(rd.grades).map(([k,v])=>k+":"+v+"/20").join(", ")||"Aucune"}
Risques détectés: ${rd.risks.map(r=>r.cat+": "+r.d).join("; ")||"Aucun"}
Observations enseignant: ${obsText||"Aucune"}

Analyse complète:
1. 🎯 Score de risque (0-10) et justification
2. 📋 Indicateurs par catégorie: Lecture, Écriture, Maths, Attention, Mémoire, Rythme, Absentéisme, Stress émotionnel
3. ⚠️ Alertes prioritaires
4. 📞 Message bienveillant pour les parents
5. 🎓 Stratégie de soutien pour l'enseignant
6. 📅 Plan d'intervention sur 4 semaines`}],sys,2000);
    setAnalysis({text:r,rd,student:s}); setLoading(false);
  };

  const weeklyReport = async () => {
    setLoading(true); setReportResult("");
    const rows=students.map(s=>{const rd=getRisk(s);return `${s.name}: score=${rd.score}/10, moy=${rd.avg?.toFixed(1)||"N/A"}/20, présence=${rd.attRate!=null?rd.attRate+"%":"N/A"}, alertes=${rd.risks.map(r=>r.cat).join("/")||"aucune"}`;}).join("\n");
    const sys=`Tu es ${BRAND_SHORT}, générateur de rapports scolaires. Génère un rapport hebdomadaire professionnel en français.`;
    const r=await callAI([{role:"user",content:`Classe: ${cls} — ${students.length} élèves\n${rows}\n\nRapport hebdomadaire de détection précoce:\n1. 📊 Résumé de la classe\n2. 🚨 Élèves à risque élevé (score ≥6)\n3. ⚠️ Élèves à surveiller (score 3-5)\n4. ✅ Élèves en bonne progression\n5. 📋 Recommandations pour la semaine\n6. 📧 Message synthèse pour la direction`}],sys,2000);
    setReportResult(r); setLoading(false);
  };

  return (
    <div>
      <div style={{display:"flex",gap:5,marginBottom:12,overflowX:"auto",paddingBottom:3}}>
        {[{id:"dashboard",l:"📊 Tableau de bord"},{id:"student",l:"🔍 Analyse élève"},{id:"report",l:"📋 Rapport hebdo"}].map(t=>(
          <button key={t.id} onClick={()=>setMode(t.id)} style={{padding:"7px 12px",borderRadius:16,border:"1px solid "+(mode===t.id?C.red:C.border),background:mode===t.id?C.red+"18":"transparent",color:mode===t.id?C.red:C.m,fontSize:10,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{t.l}</button>
        ))}
      </div>

      {mode==="dashboard"&&<>
        <div style={{fontSize:10,color:C.m,marginBottom:10,lineHeight:1.5}}>Scores de risque éducatif — {cls} — {students.length} élèves. Indicateurs éducatifs uniquement, non médicaux.</div>
        {students.length===0&&<Card s={{textAlign:"center",padding:24,color:C.m}}>Aucun élève dans cette classe</Card>}
        {students.map(s=>{const rd=getRisk(s);return(
          <Card key={s.id} s={{marginBottom:7,padding:13,background:sc(rd.score)+"06",border:"1px solid "+sc(rd.score)+"20"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:rd.risks.length?7:0}}>
              <div style={{width:40,height:40,borderRadius:10,background:sc(rd.score)+"20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:sc(rd.score)}}>{rd.score}/10</div>
              <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700}}>{s.name}</div><div style={{fontSize:10,color:C.m}}>Moy: {rd.avg?.toFixed(1)||"—"}/20 • {rd.attRate!=null?rd.attRate+"%":"—"} présence</div></div>
              <button onClick={()=>{setSelStu(s.id);setMode("student");}} style={{padding:"5px 9px",borderRadius:7,border:"1px solid "+C.red+"30",background:C.red+"10",color:C.red,fontSize:9,fontWeight:700,cursor:"pointer"}}>Analyser →</button>
            </div>
            {rd.risks.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {rd.risks.map((r,i)=><span key={i} style={{padding:"2px 7px",borderRadius:8,background:(r.sev==="high"?C.red:C.amber)+"15",color:r.sev==="high"?C.red:C.amber,fontSize:9,fontWeight:700}}>{r.cat}</span>)}
            </div>}
          </Card>
        );})}
      </>}

      {mode==="student"&&<>
        <Sel label="Sélectionner l'élève" value={selStu} onChange={setSelStu} options={students.map(s=>({v:s.id,l:s.name}))}/>
        {selStu&&(()=>{const s=students.find(x=>x.id===selStu);if(!s)return null;const rd=getRisk(s);return(<>
          <Card s={{marginBottom:10,background:sc(rd.score)+"08",border:"1px solid "+sc(rd.score)+"25",padding:14}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
              <div style={{width:50,height:50,borderRadius:13,background:sc(rd.score)+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:sc(rd.score)}}>{rd.score}/10</div>
              <div><div style={{fontSize:14,fontWeight:800}}>{s.name}</div><div style={{fontSize:10,color:C.m}}>Score de risque éducatif — non médical</div></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
              {[{v:rd.avg?.toFixed(1)||"—",l:"Moyenne",c:rd.avg>=10?C.green:C.red},{v:rd.attRate!=null?rd.attRate+"%":"—",l:"Présence",c:rd.attRate>=85?C.green:C.amber},{v:rd.absences,l:"Absences",c:rd.absences>5?C.red:C.green}].map((x,i)=>(
                <div key={i} style={{textAlign:"center",padding:8,background:"rgba(0,0,0,0.2)",borderRadius:8}}><div style={{fontSize:14,fontWeight:800,color:x.c}}>{x.v}</div><div style={{fontSize:8,color:C.m}}>{x.l}</div></div>
              ))}
            </div>
          </Card>
          <Card s={{marginBottom:10}}><div style={{fontSize:11,fontWeight:800,marginBottom:6}}>🔍 Observations enseignant (optionnel)</div><Textarea value={obsText} onChange={setObsText} ph="Comportement, participation, difficultés observées en classe..." rows={2}/></Card>
          <Btn onClick={analyzeStudent} color={C.red} full disabled={loading} s={{marginBottom:10}}>{loading?<><Spinner/>Analyse...</>:"🔍 Lancer l'analyse complète"}</Btn>
          {loading&&<Card s={{textAlign:"center",padding:24}}><div className="blink" style={{color:C.red}}><Spinner/>Analyse des indicateurs éducatifs...</div></Card>}
          {analysis&&analysis.student.id===s.id&&!loading&&<Card s={{background:C.red+"06",border:"1px solid "+C.red+"20"}}><div style={{fontSize:10,color:C.red,fontWeight:800,marginBottom:7}}>⚠️ Indicateurs éducatifs uniquement — Pas de diagnostic médical</div><div>{renderMd(analysis.text)}</div></Card>}
        </>);})()}
      </>}

      {mode==="report"&&<>
        <p style={{fontSize:11,color:C.m,lineHeight:1.5,marginBottom:12}}>Rapport hebdomadaire automatique basé sur les données de présence et notes de la classe <strong style={{color:C.w}}>{cls}</strong>.</p>
        <Btn onClick={weeklyReport} color={C.red} disabled={loading} s={{marginBottom:12}}>{loading?<><Spinner/>Génération...</>:"📋 Générer le rapport hebdomadaire"}</Btn>
        {reportResult&&<Card s={{background:C.red+"06",border:"1px solid "+C.red+"20"}}><div>{renderMd(reportResult)}</div></Card>}
      </>}
    </div>
  );
};

// PARENT COACHING PANEL (AI) — ENHANCED

const ParentCoachingPanel = ({user, db, children}) => {
  const [selChild,setSelChild] = useState(children[0]?.id||"");
  const [coachType,setCoachType] = useState("daily");
  const [lang,setLang] = useState("fr");
  const [result,setResult] = useState("");
  const [loading,setLoading] = useState(false);

  const LANGS = [{v:"fr",l:"🇫🇷 Français"},{v:"en",l:"🇬🇧 English"},{v:"ar",l:"🇩🇯 العربية"},{v:"so",l:"🇸🇴 Soomaali"}];
  const LANG_SYS = {fr:"Réponds UNIQUEMENT en français.",en:"Reply ONLY in English.",ar:"أجب باللغة العربية فقط.",so:"Ku jawaab Soomaali kaliya."};

  const TYPES = [
    {id:"daily",ic:"☀️",l:"Conseils du jour"},
    {id:"weekly",ic:"📊",l:"Résumé semaine"},
    {id:"plan",ic:"📅",l:"Planning études"},
    {id:"comm",ic:"✉️",l:"Message enseignant"}
  ];

  const getChildData = (id) => {
    const child=children.find(c=>c.id===id); if(!child) return null;
    const grades={};
    Object.entries(db.grades||{}).forEach(([k,v])=>{if(v[id]!==undefined){const subj=k.split("::")[1];grades[subj]=v[id];}});
    const att=Object.entries(db.attendance||{}).filter(([k])=>k.startsWith((child.cls||"")+"::")).map(([,v])=>v[id]);
    const attRate=att.length?Math.round(att.filter(s=>s==="present").length/att.length*100):null;
    const gv=Object.values(grades).map(Number); const avg=gv.length?(gv.reduce((a,b)=>a+b,0)/gv.length).toFixed(1):null;
    const weak=Object.entries(grades).filter(([,g])=>Number(g)<10).map(([s])=>s);
    const strong=Object.entries(grades).filter(([,g])=>Number(g)>=14).map(([s])=>s);
    return {child,grades,attRate,avg,weak,strong};
  };

  const generate = async () => {
    const data=getChildData(selChild); if(!data) return;
    const {child,avg,attRate,weak,strong}=data;
    setLoading(true); setResult("");
    const typePrompts={
      daily:`Génère 5 conseils pratiques simples pour AUJOURD'HUI pour aider ${child.name} à la maison. Chaque conseil doit être actionnable en moins de 30 minutes. Inclus un conseil lecture, un conseil mathématiques, un conseil motivation, un conseil routine et un conseil communication parent-enfant.`,
      weekly:`Génère un résumé hebdomadaire d'apprentissage pour ${child.name} avec: performance de la semaine, 3 points positifs à célébrer, 2 axes d'amélioration, 3 activités recommandées pour le week-end et un objectif pour la semaine prochaine.`,
      plan:`Crée un planning d'études quotidien complet à la maison pour ${child.name} sur une semaine type. Inclus: horaires précis (ex: 16h-17h), matières à prioriser selon les notes, durées adaptées à l'âge, pauses obligatoires, temps d'écran limité et activité physique.`,
      comm:`Rédige un message positif et constructif que ${user.name} peut envoyer à l'enseignant de ${child.name} pour établir un partenariat école-famille. Inclus: ce que l'enfant aime à l'école, une question sur son comportement en classe et une proposition de collaboration.`
    };
    const sys=`Tu es ${BRAND_SHORT}, assistant coaching parental IA. Tu aides les parents avec des conseils bienveillants, pratiques et adaptés à l'âge de l'enfant. ${LANG_SYS[lang]} Sois chaleureux, concret et encourageant. Utilise des emojis.`;
    const r=await callAI([{role:"user",content:`Parent: ${user.name} | Enfant: ${child.name} | Classe: ${child.cls} | Niveau: ${c2l(child.cls)}
Moyenne générale: ${avg||"N/A"}/20 | Présence: ${attRate!=null?attRate+"%":"N/A"}
Points forts: ${strong.join(", ")||"À évaluer"} | À renforcer: ${weak.join(", ")||"Aucun identifié"}

${typePrompts[coachType]}`}],sys,1800);
    setResult(r); setLoading(false);
  };

  if(children.length===0) return <Card s={{textAlign:"center",padding:32,color:C.m}}><div style={{fontSize:32,marginBottom:8}}>👶</div><div>Aucun enfant associé à votre compte.<br/>Contactez l'administration.</div></Card>;

  return (
    <div>
      <Sel label="Enfant" value={selChild} onChange={setSelChild} options={children.map(c=>({v:c.id,l:c.name+" ("+c.cls+")"}))}/>
      <div style={{marginBottom:12}}>
        <label style={{fontSize:10,color:C.m,fontWeight:700,display:"block",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Langue de coaching</label>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {LANGS.map(l=>(
            <button key={l.v} onClick={()=>setLang(l.v)} style={{padding:"6px 11px",borderRadius:8,border:"1px solid "+(lang===l.v?C.teal:C.border),background:lang===l.v?C.teal+"18":"transparent",color:lang===l.v?C.teal:C.m,fontSize:11,fontWeight:700,cursor:"pointer"}}>{l.l}</button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <label style={{fontSize:10,color:C.m,fontWeight:700,display:"block",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Type de coaching</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {TYPES.map(t=>(
            <button key={t.id} onClick={()=>setCoachType(t.id)} style={{padding:"10px 8px",borderRadius:10,border:"1px solid "+(coachType===t.id?C.teal:C.border),background:coachType===t.id?C.teal+"15":"transparent",color:coachType===t.id?C.teal:C.m,fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:18,marginBottom:2}}>{t.ic}</div>{t.l}
            </button>
          ))}
        </div>
      </div>
      <Btn onClick={generate} color={C.teal} full disabled={loading||!selChild} s={{marginBottom:14}}>{loading?<><Spinner/>Génération...</>:"🤝 Générer le coaching"}</Btn>
      {result&&<Card s={{background:C.teal+"08",border:"1px solid "+C.teal+"25"}}><div style={{fontSize:10,fontWeight:800,color:C.teal,marginBottom:8}}>🤝 Coaching personnalisé — {LANGS.find(l=>l.v===lang)?.l}</div><div>{renderMd(result)}</div></Card>}
    </div>
  );
};

              <button onClick={()=>setShowPw(!showPw)} style={{padding:"0 12px",borderRadius:9,border:"1px solid "+C.border,background:C.card,cursor:"pointer"}}>{showPw?"🙈":"👁️"}</button>

// ═══════════════════════════════════════════
// QUIZ CARD
// ═══════════════════════════════════════════
const QuizCard = ({q,onAnswer,done,sel}) => {
  const ok = done && sel===q.c;
  return (
    <Card s={{marginTop:10,background:done?(ok?C.green+"08":C.red+"08"):C.card,border:"1px solid "+(done?(ok?C.green:C.red):C.border)+"20"}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:12,lineHeight:1.5}}>{q.q}</div>
      {q.os.map((o,i)=>{
        const isT=done&&i===sel; const isR=done&&i===q.c;
        return <button key={i} onClick={()=>!done&&onAnswer(i)} disabled={done}
          style={{display:"block",width:"100%",padding:"10px 14px",borderRadius:9,textAlign:"left",fontSize:12,fontWeight:600,cursor:done?"default":"pointer",marginBottom:5,border:"1.5px solid "+(isR?C.green:isT&&!ok?C.red:C.border),background:isR?C.green+"15":isT&&!ok?C.red+"15":C.card,color:isR?C.green:isT&&!ok?C.red:C.w}}>
          {"ABCD"[i]}) {o}{isR&&done?" ✅":""}{isT&&!ok&&done?" ❌":""}
        </button>;
      })}
      {done&&<div style={{marginTop:10,padding:10,borderRadius:8,background:(ok?C.green:C.red)+"08",border:"1px solid "+(ok?C.green:C.red)+"20"}}>
        <div style={{fontSize:11,fontWeight:800,color:ok?C.green:C.red}}>{ok?"✅ Correct !":"❌ Pas tout à fait..."}</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.7)",lineHeight:1.6,marginTop:3}}>{q.ex}</div>
      </div>}
    </Card>
  );
};

// ═══════════════════════════════════════════
// AI CHAT COMPONENT (reusable)
// ═══════════════════════════════════════════
const AiChat = ({systemPrompt,placeholder="Votre message...",welcomeMsg,enableQuiz=false}) => {
  const [msgs,setMsgs] = useState([]);
  const [inp,setInp] = useState("");
  const [loading,setLoading] = useState(false);
  const [quizzes,setQuizzes] = useState([]);
  const [quizAnswers,setQA] = useState({});
  const ref = useRef(null);

  useEffect(()=>{
    if(welcomeMsg){
      setLoading(true);
      callAI([{role:"user",content:welcomeMsg}],systemPrompt).then(r=>{
        setMsgs([{role:"ai",text:r}]);
        if(enableQuiz) setQuizzes(parseQuiz(r));
        setLoading(false);
      });
    }
  },[]);

  useEffect(()=>{ if(ref.current) ref.current.scrollTo({top:ref.current.scrollHeight,behavior:"smooth"}); },[msgs,loading]);

  const send = async (custom) => {
    const txt = custom||inp.trim(); if(!txt||loading) return;
    if(!custom) setInp("");
    const history = [...msgs,{role:"user",text:txt}];
    setMsgs(history); setQuizzes([]); setQA({}); setLoading(true);
    const apiMsgs = history.map(m=>({role:m.role==="ai"?"assistant":"user",content:m.text}));
    const r = await callAI(apiMsgs.slice(-16),systemPrompt);
    const newMsgs = [...history,{role:"ai",text:r}];
    setMsgs(newMsgs);
    if(enableQuiz) setQuizzes(parseQuiz(r));
    setLoading(false);
  };

  const handleQA = (qi,oi) => {
    setQA(p=>({...p,[qi]:oi}));
    const q=quizzes[qi]; const ok=oi===q.c;
    setTimeout(()=>{
      if(ok) send('✅ Bonne réponse! Question suivante niveau supérieur.');
      else send('❌ Mauvaise réponse. Bonne: "'+q.os[q.c]+'". Génère une question similaire.');
    },1200);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div ref={ref} style={{flex:1,overflowY:"auto",paddingBottom:8}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:8}}>
            <div style={{maxWidth:"90%",padding:m.role==="user"?"10px 14px":"12px 16px",borderRadius:m.role==="user"?"14px 14px 4px 14px":"14px 14px 14px 4px",background:m.role==="user"?C.primary+"20":"rgba(255,255,255,0.04)",border:"1px solid "+(m.role==="user"?C.primary:C.border)+"20"}}>
              {m.role==="ai"&&<div style={{fontSize:10,color:C.gold,fontWeight:700,marginBottom:4}}>{ICON} {BRAND_SHORT} IA</div>}
              {m.role==="ai"?<div>{renderMd(m.text)}</div>:<div style={{fontSize:13,color:"rgba(255,255,255,0.85)",lineHeight:1.6}}>{m.text}</div>}
            </div>
          </div>
        ))}
        {quizzes.map((q,i)=><QuizCard key={i+"_"+msgs.length} q={q} done={quizAnswers[i]!==undefined} sel={quizAnswers[i]} onAnswer={o=>handleQA(i,o)}/>)}
        {loading&&<div style={{fontSize:12,color:C.gold,padding:"8px 0"}} className="blink"><Spinner/>{BRAND_SHORT} réfléchit...</div>}
      </div>
      <div style={{display:"flex",gap:8,paddingTop:8,borderTop:"1px solid "+C.border}}>
        <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder={placeholder} style={{flex:1,padding:"11px 14px",borderRadius:10,border:"1.5px solid "+C.border,background:"rgba(255,255,255,0.04)",color:C.w,fontSize:13,outline:"none"}}/>
        <button onClick={()=>send()} disabled={loading} style={{padding:"11px 16px",borderRadius:10,border:"none",background:C.primary,color:C.w,fontWeight:800,cursor:"pointer",opacity:loading?0.5:1,fontSize:16}}>↑</button>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════
function App() {
  const [db, _setDB] = React.useState(loadDB);
  const [currentUser, setCurrentUser] = React.useState(null);

  const setDB = React.useCallback(updater => {
    _setDB(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveDB(next);
      return next;
    });
  }, []);

  const logout = () => setCurrentUser(null);

  if(!currentUser) return <LoginPage db={db} setDB={setDB} onLogin={setCurrentUser}/>;
  if(currentUser.role==="student") return <StudentPortal user={currentUser} db={db} onOut={logout}/>;
  if(currentUser.role==="parent") return <ParentPortal user={currentUser} db={db} onOut={logout}/>;
  if(currentUser.role==="teacher") return <TeacherPortal user={currentUser} db={db} setDB={setDB} onOut={logout}/>;
  if(currentUser.role==="admin") return <AdminPortal user={currentUser} db={db} setDB={setDB} onOut={logout}/>;
  return <div style={{color:"#ef4444",padding:24}}>Rôle inconnu</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
