<head>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel" data-type="module">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ═══ THEME ═══
const Z = {
  bg: "#060b16", c: "rgba(255,255,255,0.03)", bd: "rgba(255,255,255,0.06)",
  w: "#fff", m: "rgba(255,255,255,0.42)", d: "rgba(255,255,255,0.25)",
  g: "#22c55e", r: "#ef4444", a: "#f59e0b", b: "#0ea5e9", p: "#a855f7", t: "#14b8a6"
};
const FD = "'Libre Baskerville',Georgia,serif";
const BR = "École Champion", BI = "🏆", BC = "#d4a017";

// ═══ PERSISTENCE ═══
const SK = "ecole_champion_v4";
const defDB = {
  users: { ADM001: { pw: "admin2026", role: "admin", name: "Directeur Général" } },
  classes: ["Maternelle GS","CP","CE1","CE2","CM1","CM2","6ème A","6ème B","5ème A","5ème B","4ème A","4ème B","3ème A","3ème B","2nde A","1ère A","Tle A"],
  chapters: {}
};

const loadDB = () => {
  try {
    const raw = window.localStorage?.getItem(SK);
    if (raw) {
      const p = JSON.parse(raw);
      if (p.users && p.classes) {
        if (!p.chapters) p.chapters = {};
        if (!Object.values(p.users).some(u => u.role === "admin")) {
          p.users.ADM001 = defDB.users.ADM001;
        }
        return p;
      }
    }
  } catch (e) { /* ignore */ }
  return JSON.parse(JSON.stringify(defDB));
};

const saveDB = (db) => {
  try { window.localStorage?.setItem(SK, JSON.stringify(db)); } catch (e) { /* ignore */ }
};

// ═══ CURRICULUM ═══
const CUR = {
  "Maternelle": { s: ["Éveil","Graphisme","Comptage","Langage oral","Motricité"], d: "Maternelle" },
  "CP": { s: ["Lecture","Écriture","Mathématiques","Arabe"], d: "CP" },
  "CE1": { s: ["Français","Mathématiques","Découverte du monde","Arabe","EPS"], d: "CE1" },
  "CE2": { s: ["Français","Mathématiques","Sciences","Histoire-Géo","Arabe","EPS"], d: "CE2" },
  "CM1": { s: ["Français","Mathématiques","Sciences","Histoire-Géo","Arabe","Anglais","EPS"], d: "CM1" },
  "CM2": { s: ["Français","Mathématiques","Sciences","Histoire-Géo","Arabe","Anglais","Éducation civique","EPS"], d: "CM2" },
  "6ème": { s: ["Français","Mathématiques","SVT","Physique-Chimie","Histoire-Géo","Arabe","Anglais","EPS"], d: "6ème" },
  "5ème": { s: ["Français","Mathématiques","SVT","Physique-Chimie","Histoire-Géo","Arabe","Anglais","Technologie","EPS"], d: "5ème" },
  "4ème": { s: ["Français","Mathématiques","SVT","Physique-Chimie","Histoire-Géo","Arabe","Anglais","Technologie","EPS"], d: "4ème" },
  "3ème": { s: ["Français","Mathématiques","SVT","Physique-Chimie","Histoire-Géo","Arabe","Anglais","Technologie","Éducation civique","EPS"], d: "3ème (Brevet)" },
  "2nde": { s: ["Français","Mathématiques","SVT","Physique-Chimie","Histoire-Géo","Arabe","Anglais","SES","EPS"], d: "Seconde" },
  "1ère": { s: ["Français","Mathématiques","Histoire-Géo","Arabe","Anglais","Philosophie","EPS"], d: "Première" },
  "Terminale": { s: ["Philosophie","Mathématiques","Histoire-Géo","Arabe","Anglais","EPS"], d: "Terminale (Bac)" }
};
const c2l = (cls) => {
  if (!cls) return "3ème";
  if (/Maternelle|GS|KG/i.test(cls)) return "Maternelle";
  for (const l of Object.keys(CUR)) { if (cls.includes(l)) return l; }
  return "3ème";
};
const SUB_LIST = ["Mathématiques","Français","Sciences","Histoire-Géo","Anglais","Arabe","Physique-Chimie","SVT","Philosophie","EPS","SES","Technologie","Éducation civique"];

// Default chapters per subject
const DEFAULT_CHAPTERS = {
  "Mathématiques": ["Nombres et calculs","Algèbre","Géométrie","Statistiques et probabilités","Fonctions","Mesures et grandeurs"],
  "Français": ["Grammaire","Conjugaison","Orthographe","Vocabulaire","Rédaction","Lecture et compréhension","Littérature"],
  "Sciences": ["Le vivant","La matière","L'énergie","La Terre","Technologie"],
  "SVT": ["La cellule","Nutrition","Reproduction","Écosystèmes","Génétique","Géologie"],
  "Physique-Chimie": ["Électricité","Mécanique","Optique","Chimie des solutions","Atomes et molécules"],
  "Histoire-Géo": ["Histoire de Djibouti","Afrique contemporaine","Géographie physique","Géographie humaine","Monde contemporain"],
  "Anglais": ["Grammar","Vocabulary","Reading","Writing","Listening","Speaking"],
  "Arabe": ["النحو (Grammaire)","الصرف (Morphologie)","التعبير الكتابي (Expression écrite)","القراءة (Lecture)","المحادثة (Conversation)"],
  "Philosophie": ["La conscience","La liberté","Le devoir","La vérité","L'État","La justice"],
  "EPS": ["Athlétisme","Sports collectifs","Gymnastique","Natation"],
  "SES": ["Économie","Sociologie","Science politique"],
  "Technologie": ["Informatique","Électronique","Mécanique","Programmation"],
  "Éducation civique": ["Citoyenneté","Droits et devoirs","Institutions","Démocratie"],
  "Éveil": ["Découverte du monde","Les animaux","Les plantes","Mon corps"],
  "Graphisme": ["Tracer des lignes","Les formes","Écrire son prénom"],
  "Comptage": ["Compter jusqu'à 10","Compter jusqu'à 20","Les formes géométriques"],
  "Langage oral": ["Se présenter","Raconter une histoire","Vocabulaire quotidien"],
  "Motricité": ["Courir","Sauter","Lancer","Équilibre"],
  "Lecture": ["L'alphabet","Les syllabes","Lire des mots","Lire des phrases"],
  "Écriture": ["Les lettres","Les mots","Copier","Écrire des phrases"],
  "Découverte du monde": ["Les saisons","Les animaux","Mon quartier","L'eau"],
  "Rédaction": ["Le récit","La description","Le dialogue","L'argumentation"],
  "Vocabulaire": ["Synonymes","Antonymes","Champ lexical","Expressions"],
  "Littérature": ["Le roman","La poésie","Le théâtre","La nouvelle"]
};

const getChaptersForSubject = (db, cls, subject) => {
  const key = cls + "::" + subject;
  if (db.chapters[key] && db.chapters[key].length > 0) return db.chapters[key];
  return DEFAULT_CHAPTERS[subject] || ["Chapitre 1","Chapitre 2","Chapitre 3"];
};

// ═══ AI ═══
const buildSys = (u, mode) => {
  const lv = c2l(u.cls);
  const cur = CUR[lv];
  return `Tu es "${BR}", système pédagogique d'une école d'excellence à Djibouti. JAMAIS dire "IA" ou "intelligence artificielle". Tu es ${BR}.\nÉLÈVE: ${u.name} | ${u.cls} | ${lv} | Matières: ${(cur?.s || []).join(", ")}\nMODE: ${mode}\nAPRÈS CHAQUE réponse quiz: ✅ ou ❌ IMMÉDIATEMENT. FAUX=corriger+NOUVELLE question MÊME niveau. JUSTE=niveau supérieur.\nFormat quiz:\n[QUIZ]\nQ: question\nA) opt1\nB) opt2\nC) opt3\nD) opt4\nCORRECT: B\nEXPLICATION: explication\n[/QUIZ]\nSalue au nom de ${BR}.`;
};

// API Key management
const getApiKey = () => {
  try { return localStorage.getItem("ecole_champion_api_key") || ""; } catch(e) { return ""; }
};
const setApiKey = (k) => {
  try { localStorage.setItem("ecole_champion_api_key", k); } catch(e) {}
};

const callAPI = async (msgs, sys) => {
  const key = getApiKey();
  if (!key) return "⚠️ Clé API non configurée. Allez dans Admin → ⚙️ pour la configurer.";
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514", max_tokens: 1500, system: sys,
        messages: msgs.map(m => ({ role: m.r === "school" ? "assistant" : "user", content: m.t }))
      })
    });
    const d = await r.json();
    if (d.content && d.content[0]) return d.content[0].text;
    if (d.error) {
      if (d.error.message && d.error.message.includes("invalid x-api-key"))
        return "❌ Clé API invalide. Vérifiez votre clé dans Admin → ⚙️.";
      return "Erreur: " + d.error.message;
    }
    return "Service indisponible.";
  } catch (e) {
    return "Erreur de connexion: " + e.message + ". Vérifiez votre internet.";
  }
};

const parseQ = (t) => {
  const qs = [];
  const rx = /\[QUIZ\]([\s\S]*?)\[\/QUIZ\]/g;
  let m;
  while ((m = rx.exec(t)) !== null) {
    const b = m[1];
    const qM = b.match(/Q:\s*(.+)/);
    const os = [];
    for (const l of ["A","B","C","D"]) {
      const o = b.match(new RegExp(l + "\\)\\s*(.+)"));
      if (o) os.push(o[1].trim());
    }
    const cM = b.match(/CORRECT:\s*([A-D])/);
    const eM = b.match(/EXPLICATION:\s*([\s\S]+?)$/m);
    if (qM && os.length >= 2 && cM) {
      qs.push({ q: qM[1].trim(), os, c: "ABCD".indexOf(cM[1]), ex: eM ? eM[1].trim() : "" });
    }
  }
  return qs;
};

const renderMd = (t) => {
  if (!t) return null;
  return t.replace(/\[QUIZ\][\s\S]*?\[\/QUIZ\]/g, "").trim().split("\n").map((l, i) => {
    if (!l.trim()) return <div key={i} style={{ height: 5 }} />;
    let h = l.replace(/\*\*(.+?)\*\*/g, '<strong style="color:#fff">$1</strong>');
    h = h.replace(/\*(.+?)\*/g, '<em style="color:' + BC + '">$1</em>');
    if (l.startsWith("### ")) return <div key={i} style={{ fontSize: 13, fontWeight: 800, color: BC, margin: "8px 0 4px" }}>{l.slice(4)}</div>;
    if (l.startsWith("## ")) return <div key={i} style={{ fontSize: 14, fontWeight: 800, margin: "8px 0 4px" }}>{l.slice(3)}</div>;
    if (l.startsWith("- ") || l.startsWith("• ")) return <div key={i} style={{ paddingLeft: 10, fontSize: 12, color: "rgba(255,255,255,0.7)", lineHeight: 1.7 }}>• {l.slice(2)}</div>;
    if (l.startsWith("> ")) return <div key={i} style={{ borderLeft: "3px solid " + BC, paddingLeft: 10, margin: "4px 0", fontSize: 12, color: "rgba(255,255,255,0.65)" }}>{l.slice(2)}</div>;
    return <p key={i} style={{ fontSize: 12, color: "rgba(255,255,255,0.75)", lineHeight: 1.7, margin: "2px 0" }} dangerouslySetInnerHTML={{ __html: h }} />;
  });
};

// ═══ MODES ═══
const MODES = [
  { id: "chat", ic: "💬", n: "DISCUSSION", d: "Pose tes questions", cl: Z.b },
  { id: "setup", ic: "⚙️", n: "DIAGNOSTIC", d: "Évalue ton niveau", cl: "#6366f1" },
  { id: "learn", ic: "📖", n: "COURS", d: "Leçons expliquées", cl: Z.g },
  { id: "quiz", ic: "❓", n: "QUIZ", d: "Questions adaptées", cl: Z.a },
  { id: "spaced", ic: "🔄", n: "RÉVISION", d: "Répétition espacée", cl: Z.p },
  { id: "visual", ic: "🗺️", n: "CARTES", d: "Résumés visuels", cl: "#ec4899" },
  { id: "research", ic: "🔍", n: "RECHERCHE", d: "Méthode socratique", cl: Z.t },
  { id: "plan", ic: "📋", n: "PLANNING", d: "Plan sur mesure", cl: "#f97316" },
  { id: "export", ic: "📤", n: "FICHES", d: "Fiches à garder", cl: "#8b5cf6" }
];

// ═══ UI ═══
const st = { card: (extra = {}) => ({ padding: 16, borderRadius: 14, background: Z.c, border: "1px solid " + Z.bd, ...extra }) };
const Cd = ({ children, s, onClick }) => <div onClick={onClick} style={{ ...st.card(s), cursor: onClick ? "pointer" : "default" }}>{children}</div>;
const Btn = ({ children, color = Z.b, onClick, full, outline, s = {} }) => (
  <button onClick={onClick} style={{ padding: "12px 22px", borderRadius: 10, border: outline ? "1px solid " + color + "30" : "none", background: outline ? "transparent" : color, color: outline ? color : Z.w, fontSize: 13, fontWeight: 800, cursor: "pointer", width: full ? "100%" : "auto", boxShadow: outline ? "none" : "0 4px 16px " + color + "25", ...s }}>{children}</button>
);
const Inp = ({ label, value, onChange, type = "text", ph = "", dis }) => (
  <div style={{ marginBottom: 12 }}>
    <label style={{ fontSize: 10, color: Z.m, fontWeight: 700, display: "block", marginBottom: 4 }}>{label}</label>
    <input value={value} onChange={e => onChange(e.target.value)} type={type} placeholder={ph} disabled={dis}
      style={{ width: "100%", padding: "11px 12px", borderRadius: 8, border: "1.5px solid " + Z.bd, background: "rgba(255,255,255,0.03)", color: dis ? Z.d : Z.w, fontSize: 13, outline: "none", boxSizing: "border-box", opacity: dis ? 0.5 : 1 }} />
  </div>
);
const Sel = ({ label, value, onChange, options }) => (
  <div style={{ marginBottom: 12 }}>
    <label style={{ fontSize: 10, color: Z.m, fontWeight: 700, display: "block", marginBottom: 4 }}>{label}</label>
    <select value={value} onChange={e => onChange(e.target.value)} style={{ width: "100%", padding: "11px 12px", borderRadius: 8, border: "1.5px solid " + Z.bd, background: "rgba(255,255,255,0.03)", color: Z.w, fontSize: 13, outline: "none", boxSizing: "border-box" }}>
      <option value="">— Sélectionner —</option>
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  </div>
);
const Hd = ({ t1, t2, onOut }) => (
  <div style={{ padding: "12px 18px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid " + Z.bd, background: "rgba(6,11,22,0.92)", backdropFilter: "blur(16px)", position: "sticky", top: 0, zIndex: 10 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <div style={{ width: 32, height: 32, borderRadius: 8, background: BC + "20", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>{BI}</div>
      <div>
        <div style={{ fontFamily: FD, fontSize: 14, fontWeight: 700 }}>{t1}</div>
        <div style={{ fontSize: 10, color: Z.m, marginTop: 1 }}>{t2}</div>
      </div>
    </div>
    <button onClick={onOut} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid " + Z.r + "25", background: Z.r + "0c", color: Z.r, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>↩</button>
  </div>
);
const Nv = ({ tabs, act, onT, ac }) => (
  <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", background: "rgba(6,11,22,0.97)", backdropFilter: "blur(20px)", borderTop: "1px solid " + Z.bd, padding: "5px 0 16px", zIndex: 20 }}>
    {tabs.map(t => (
      <div key={t.id} onClick={() => onT(t.id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, cursor: "pointer", paddingTop: 4 }}>
        <span style={{ fontSize: 17, opacity: act === t.id ? 1 : 0.3 }}>{t.ic}</span>
        <span style={{ fontSize: 8, fontWeight: 700, color: act === t.id ? ac : Z.m }}>{t.lb}</span>
        {act === t.id && <div style={{ width: 12, height: 2.5, borderRadius: 2, background: ac }} />}
      </div>
    ))}
  </div>
);

// ═══ QUIZ CARD ═══
const QCard = ({ q, onA, done, si }) => {
  const ok = done && si === q.c;
  return (
    <Cd s={{ marginTop: 10, padding: 16, background: done ? (ok ? Z.g + "08" : Z.r + "08") : Z.c, border: "1px solid " + (done ? (ok ? Z.g : Z.r) : Z.bd) + "18" }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, lineHeight: 1.5 }}>{q.q}</div>
      {q.os.map((o, i) => {
        const isT = done && i === si;
        const isR = done && i === q.c;
        return (
          <button key={i} onClick={() => !done && onA(i)} disabled={done}
            style={{ display: "block", width: "100%", padding: "11px 14px", borderRadius: 10, textAlign: "left", fontSize: 12, fontWeight: 600, cursor: done ? "default" : "pointer", marginBottom: 5, border: "1.5px solid " + (isR ? Z.g : isT && !ok ? Z.r : Z.bd), background: isR ? Z.g + "15" : isT && !ok ? Z.r + "15" : Z.c, color: isR ? Z.g : isT && !ok ? Z.r : Z.w }}>
            {"ABCD"[i]}) {o}{isR && done ? " ✅" : ""}{isT && !ok && done ? " ❌" : ""}
          </button>
        );
      })}
      {done && (
        <div style={{ marginTop: 10, padding: 10, borderRadius: 8, background: (ok ? Z.g : Z.r) + "08", border: "1px solid " + (ok ? Z.g : Z.r) + "15" }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: ok ? Z.g : Z.r }}>{ok ? "✅ Correct !" : "❌ Pas tout à fait..."}</div>
          <div style={{ fontSize: 12, color: "rgba(255,255,255,0.7)", lineHeight: 1.6, marginTop: 3 }}>{q.ex}</div>
          {!ok && <div style={{ fontSize: 11, color: BC, marginTop: 6, fontWeight: 700 }}>{BI} {BR} prépare une question similaire...</div>}
        </div>
      )}
    </Cd>
  );
};

// ═══ CHAT ═══
const Chat = ({ user, mode, onBack }) => {
  const [msgs, setM] = useState([]);
  const [inp, setI] = useState("");
  const [ld, setLd] = useState(false);
  const [qzs, setQz] = useState([]);
  const [qA, setQA] = useState({});
  const ref = useRef(null);
  const mo = MODES.find(m => m.id === mode);
  const sys = useMemo(() => buildSys(user, mo?.n || "DISCUSSION"), [user, mode]);
  const lv = c2l(user.cls);
  const cur = CUR[lv];

  useEffect(() => {
    setLd(true);
    callAPI([{ r: "user", t: "Bonjour, je suis " + user.name + " en " + user.cls + ". Mode " + (mo?.n || "") + "." }], sys)
      .then(r => { setM([{ r: "school", t: r }]); setQz(parseQ(r)); setLd(false); });
  }, []);

  useEffect(() => {
    if (ref.current) ref.current.scrollTo({ top: ref.current.scrollHeight, behavior: "smooth" });
  }, [msgs, ld, qzs]);

  const send = async (custom) => {
    const txt = custom || inp.trim();
    if (!txt || ld) return;
    if (!custom) setI("");
    const nm = [...msgs, { r: "user", t: txt }];
    setM(nm); setQz([]); setQA({}); setLd(true);
    const r = await callAPI(nm.slice(-20), sys);
    setM(p => [...p, { r: "school", t: r }]);
    setQz(parseQ(r));
    setLd(false);
  };

  const hQA = (qi, oi) => {
    setQA(p => ({ ...p, [qi]: oi }));
    const q = qzs[qi];
    const ok = oi === q.c;
    setTimeout(() => {
      if (ok) send('✅ Correct "' + q.os[oi] + '". Niveau supérieur.');
      else send('❌ Faux "' + q.os[oi] + '" à "' + q.q + '". Bonne: "' + q.os[q.c] + '". NOUVELLE question MÊME niveau.');
    }, 1500);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "calc(100dvh - 120px)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, flexShrink: 0 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: BC, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0 }}>←</button>
        <div style={{ width: 28, height: 28, borderRadius: 7, background: (mo?.cl || BC) + "18", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>{mo?.ic || BI}</div>
        <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 800 }}>{mo?.n}</div><div style={{ fontSize: 9, color: Z.m }}>{user.cls} • {lv}</div></div>
        <div style={{ fontSize: 8, color: BC, fontWeight: 700, background: BC + "15", padding: "3px 8px", borderRadius: 10 }}>{BI} {BR}</div>
      </div>
      <div style={{ display: "flex", gap: 4, overflowX: "auto", paddingBottom: 6, flexShrink: 0 }}>
        {(cur?.s || []).slice(0, 8).map(s => (

// ═══ ADMIN — CLASS + USER + CHAPTER OVERVIEW ═══
const AdminP = ({ user, db, setDB, onOut }) => {
  const [tab, setTab] = useState("home");
  const [cM, setCM] = useState(null);
  const [eId, setEI] = useState(null);
  const [fd, setFd] = useState({});
  const [msg, setMsg] = useState("");
  const [fR, setFR] = useState("all");
  const [sr, setSr] = useState("");
  const [sp, setSP] = useState(false);
  const [cd, setCD] = useState(null);
  const [nc, setNC] = useState("");
  const [selC, setSC] = useState(null);
  const [viewSubj, setVS] = useState(null);
  const ac = "#10b981";

  const us = db.users;
  const cls = db.classes || [];
  const all = Object.entries(us).map(([id, u]) => ({ id, ...u }));
  const sts = all.filter(u => u.role === "student");
  const prs = all.filter(u => u.role === "parent");
  const tcs = all.filter(u => u.role === "teacher");
  const ads = all.filter(u => u.role === "admin");
  const flt = all.filter(u => {
    if (fR !== "all" && u.role !== fR) return false;
    if (sr && !(u.name || "").toLowerCase().includes(sr.toLowerCase()) && !u.id.toLowerCase().includes(sr.toLowerCase())) return false;
    return true;
  });
  const sInC = (c) => sts.filter(s => s.cls === c);

  const genId = (r) => { const p = r === "student" ? "ECE" : r === "parent" ? "PAR" : r === "teacher" ? "PROF" : "ADM"; let n = 1; while (us[p + String(n).padStart(3, "0")]) n++; return p + String(n).padStart(3, "0"); };
  const startC = (r) => { const id = genId(r); const b = { id, pw: "", name: "", role: r }; if (r === "student") { b.cls = ""; b.parentId = ""; } if (r === "parent") b.childIds = []; if (r === "teacher") { b.subject = ""; b.classes = []; } setFd(b); setCM(r); setEI(null); setMsg(""); };
  const startE = (u) => { setFd({ ...u }); setEI(u.id); setCM(null); setMsg(""); setSP(false); setCD(null); };

  const doSave = () => {
    const d = fd;
    if (!(d.name || "").trim()) { setMsg("❌ Nom obligatoire"); return; }
    if (!(d.pw || "").trim() || d.pw.length < 4) { setMsg("❌ MDP obligatoire (min 4)"); return; }
    if (d.role === "student" && !d.cls) { setMsg("❌ Classe obligatoire"); return; }
    if (d.role === "teacher" && !d.subject) { setMsg("❌ Matière obligatoire"); return; }
    if (d.role === "teacher" && (!d.classes || !d.classes.length)) { setMsg("❌ Au moins 1 classe obligatoire"); return; }

    const id = d.id;
    const ud = { pw: d.pw.trim(), role: d.role, name: d.name.trim() };
    const nu = { ...us };

    if (d.role === "student") {
      ud.cls = d.cls; ud.parentId = d.parentId || "";
      if (d.parentId && nu[d.parentId]) {
        const pr = { ...nu[d.parentId] }; if (!pr.childIds) pr.childIds = [];
        if (!pr.childIds.includes(id)) pr.childIds = [...pr.childIds, id]; nu[d.parentId] = pr;
      }
      if (eId) { const old = (us[id] || {}).parentId; if (old && old !== d.parentId && nu[old]) nu[old] = { ...nu[old], childIds: (nu[old].childIds || []).filter(c => c !== id) }; }
    }
    if (d.role === "parent") {
      ud.childIds = d.childIds || [];
      (d.childIds || []).forEach(c => { if (nu[c]) nu[c] = { ...nu[c], parentId: id }; });
      if (eId) { ((us[id] || {}).childIds || []).filter(c => !(d.childIds || []).includes(c)).forEach(c => { if (nu[c]) nu[c] = { ...nu[c], parentId: "" }; }); }
    }
    if (d.role === "teacher") { ud.subject = d.subject; ud.classes = d.classes || []; }
    nu[id] = ud;
    setDB(p => ({ ...p, users: nu }));
    setMsg("✅ " + (cM ? "Créé" : "Modifié") + ": " + d.name + " (" + id + ")");
    setCM(null); setEI(null);
  };

  const doDel = (id) => {
    if (id === user.uid) { setMsg("❌ Auto-suppression impossible"); return; }
    const u = us[id]; const nu = { ...us };
    if (u.role === "student" && u.parentId && nu[u.parentId]) nu[u.parentId] = { ...nu[u.parentId], childIds: (nu[u.parentId].childIds || []).filter(c => c !== id) };
    if (u.role === "parent") (u.childIds || []).forEach(c => { if (nu[c]) nu[c] = { ...nu[c], parentId: "" }; });
    delete nu[id]; setDB(p => ({ ...p, users: nu })); setMsg("🗑️ Supprimé"); setEI(null); setCD(null);
  };

  const addCls = () => {
    if (!nc.trim()) { setMsg("❌ Nom vide"); return; }
    if (cls.includes(nc.trim())) { setMsg("❌ Existe déjà"); return; }
    setDB(p => ({ ...p, classes: [...p.classes, nc.trim()] })); setNC(""); setMsg("✅ Classe: " + nc.trim());
  };
  const delCls = (c) => {
    if (sInC(c).length) { setMsg("❌ " + sInC(c).length + " élève(s) dedans"); return; }
    setDB(p => ({ ...p, classes: p.classes.filter(x => x !== c) })); setMsg("🗑️ Classe supprimée"); if (selC === c) setSC(null);
  };

  const rI = (r) => r === "student" ? "🎓" : r === "parent" ? "👨‍👩‍👧" : r === "teacher" ? "📚" : "🏫";
  const rL = (r) => r === "student" ? "Élève" : r === "parent" ? "Parent" : r === "teacher" ? "Enseignant" : "Admin";
  const rC = (r) => r === "student" ? Z.b : r === "parent" ? Z.p : r === "teacher" ? Z.a : ac;

  // FORM
  const renderForm = () => {
    const d = fd; const isN = !!cM;
    return (
      <>
        <button onClick={() => { setCM(null); setEI(null); setMsg(""); }} style={{ background: "none", border: "none", color: ac, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0, marginBottom: 12 }}>← Retour</button>
        <Cd s={{ padding: 20, marginBottom: 14, background: rC(d.role) + "08", border: "1px solid " + rC(d.role) + "18" }}>

          {d.role === "student" && (

          {msg && <div style={{ padding: 12, borderRadius: 8, background: (msg.startsWith("✅") || msg.startsWith("🗑") ? Z.g : Z.r) + "0c", fontSize: 12, color: msg.startsWith("✅") || msg.startsWith("🗑") ? Z.g : Z.r, marginBottom: 12 }}>{msg}</div>}
          <Btn onClick={doSave} color={ac} full>{isN ? "✅ Créer" : "💾 Sauvegarder"}</Btn>
          {!isN && d.id !== user.uid && (

      </>

  };

  return (
    <div style={{ minHeight: "100dvh", background: "linear-gradient(170deg," + Z.bg + ",#0a1020)", color: Z.w }}>
      <Hd t1={BR + " — Admin"} t2={user.name + " • " + user.uid} onOut={onOut} />
      <div style={{ padding: "14px 18px 100px" }}>
        {(cM || eId) ? renderForm() : (
          <>
            {/* HOME */}
            {tab === "home" && (
              <>
                <ApiKeySetup />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
                  {[{ v: sts.length, l: "Élèves", c: Z.b, i: "🎓" }, { v: prs.length, l: "Parents", c: Z.p, i: "👨‍👩‍👧" }, { v: tcs.length, l: "Enseignants", c: Z.a, i: "📚" }, { v: ads.length, l: "Admins", c: ac, i: "🏫" }].map((s, i) => (

                        <div onClick={() => setVS(viewSubj === c ? null : c)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", cursor: "pointer", borderBottom: "1px solid " + Z.bd }}>

                </Cd>

                <Cd s={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, marginBottom: 10 }}>🔗 Liaisons parent ↔ élève</div>
                  {sts.map(s => {
                    const pr = s.parentId ? us[s.parentId] : null;

                      <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid " + Z.bd }}>

                {msg && <div style={{ padding: 10, borderRadius: 8, background: Z.g + "0c", fontSize: 12, color: Z.g }}>{msg}</div>}

            )}

            {/* CLASSES */}
            {tab === "classes" && (

                <div style={{ fontSize: 14, fontWeight: 800, fontFamily: FD, marginBottom: 4 }}>🏫 Classes ({cls.length})</div>
                <div style={{ fontSize: 11, color: Z.m, marginBottom: 14 }}>Un élève = une seule classe</div>
                <Cd s={{ marginBottom: 14, padding: 14 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, marginBottom: 8 }}>➕ Nouvelle classe</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input value={nc} onChange={e => setNC(e.target.value)} onKeyDown={e => { if (e.key === "Enter") addCls(); }} placeholder="Ex: 4ème C" style={{ flex: 1, padding: "10px 12px", borderRadius: 8, border: "1.5px solid " + Z.bd, background: "rgba(255,255,255,0.03)", color: Z.w, fontSize: 12, outline: "none" }} />
                    <Btn onClick={addCls} color={ac} s={{ fontSize: 11, padding: "10px 16px" }}>+ Créer</Btn>

                {cls.map(c => {
                  const si = sInC(c); const open = selC === c;
                  return (
                    <Cd key={c} s={{ marginBottom: 8, padding: 0, overflow: "hidden" }}>
                      <div onClick={() => setSC(open ? null : c)} style={{ padding: "14px 16px", display: "flex", alignItems: "center", gap: 10, cursor: "pointer", background: open ? ac + "0c" : "transparent" }}>
                        <div style={{ width: 36, height: 36, borderRadius: 10, background: ac + "18", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 800 }}>{si.length}</div>
                        <div style={{ flex: 1 }}><div style={{ fontSize: 13, fontWeight: 800 }}>{c}</div><div style={{ fontSize: 10, color: Z.m }}>{si.length} élève(s) • {c2l(c)}</div></div>
                        <span style={{ fontSize: 12, color: Z.m }}>{open ? "▼" : "▶"}</span>
                      </div>
                      {open && (
                        <div style={{ padding: "0 16px 14px", borderTop: "1px solid " + Z.bd }}>
                          {si.length === 0 ? <div style={{ padding: "10px 0", fontSize: 11, color: Z.d }}>Aucun élève</div> :
                            si.map(s => (
                              <div key={s.id} onClick={() => startE(s)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: "1px solid " + Z.bd, cursor: "pointer" }}>
                                <div style={{ width: 28, height: 28, borderRadius: 7, background: Z.b + "18", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 11 }}>{(s.name || "?")[0]}</div>
                                <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 700 }}>{s.name}</div><div style={{ fontSize: 10, color: Z.d }}>{s.id}</div></div>
                                <span style={{ fontSize: 10, color: ac }}>✏️</span>

                      )}

                })}
                {msg && <div style={{ marginTop: 10, padding: 10, borderRadius: 8, background: (msg.startsWith("✅") || msg.startsWith("🗑") ? Z.g : Z.r) + "0c", fontSize: 12, color: msg.startsWith("✅") || msg.startsWith("🗑") ? Z.g : Z.r }}>{msg}</div>}
              </>

            {/* USERS */}
            {tab === "users" && (
              <>
                <div style={{ fontSize: 14, fontWeight: 800, fontFamily: FD, marginBottom: 10 }}>👥 Utilisateurs ({all.length})</div>

                <div style={{ display: "flex", gap: 5, marginBottom: 14, flexWrap: "wrap" }}>

                    <button key={f.v} onClick={() => setFR(f.v)} style={{ padding: "6px 14px", borderRadius: 20, border: "1px solid " + (fR === f.v ? ac : Z.bd), background: fR === f.v ? ac + "18" : "transparent", color: fR === f.v ? ac : Z.m, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>{f.l} ({f.v === "all" ? all.length : all.filter(u => u.role === f.v).length})</button>
                  ))}
                </div>
                {flt.map(u => (
                  <Cd key={u.id} onClick={() => startE(u)} s={{ marginBottom: 8, display: "flex", alignItems: "center", gap: 10, padding: 13 }}>
                    <div style={{ width: 38, height: 38, borderRadius: 10, background: rC(u.role) + "18", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17 }}>{rI(u.role)}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 700 }}>{u.name}</div>
                      <div style={{ fontSize: 10, color: Z.d }}>{u.id} • {rL(u.role)}{u.cls ? " • " + u.cls : ""}{u.subject ? " • " + u.subject : ""}</div>

                    <span style={{ fontSize: 12, color: ac }}>✏️</span>

            {/* CREATE */}
            {tab === "create" && (
              <>
                <div style={{ fontSize: 14, fontWeight: 800, fontFamily: FD, marginBottom: 14 }}>➕ Créer</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

                    <Cd key={r.r} onClick={() => startC(r.r)} s={{ textAlign: "center", padding: 18, background: r.c + "08", border: "1px solid " + r.c + "18" }}>
                      <div style={{ fontSize: 30, marginBottom: 6 }}>{r.i}</div>
                      <div style={{ fontSize: 13, fontWeight: 800 }}>{r.l}</div>
                      <div style={{ fontSize: 10, color: Z.m, marginTop: 4 }}>{r.d}</div>

// ═══ LOGIN ═══
const LoginP = ({ db, onIn }) => {
  const [uid, setU] = useState("");
  const [pw, setP] = useState("");
  const [err, setE] = useState("");
  const total = Object.keys(db.users).length;

  const go = () => {
    const u = db.users[uid.toUpperCase()];
    if (!u || u.pw !== pw) { setE("❌ Identifiant ou mot de passe incorrect"); return; }
    onIn({ ...u, uid: uid.toUpperCase() });
  };

  return (
    <div style={{ minHeight: "100dvh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, background: "radial-gradient(ellipse at 25% 15%,#1a1000 0%," + Z.bg + " 65%)" }}>
      <div style={{ width: 76, height: 76, borderRadius: 20, margin: "0 auto 20px", background: "linear-gradient(135deg," + BC + ",#b8860b)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 38, boxShadow: "0 12px 40px " + BC + "30" }}>{BI}</div>
      <h1 style={{ fontFamily: FD, fontSize: 24, fontWeight: 700, margin: "0 0 4px", color: BC }}>{BR}</h1>
      <p style={{ fontSize: 12, color: Z.m, margin: "0 0 2px" }}>Révision Intelligente</p>
      <p style={{ fontSize: 10, color: Z.d, margin: "0 0 24px", letterSpacing: 2, textTransform: "uppercase" }}>Djibouti • KG → Terminale</p>
      <div style={{ width: "100%", maxWidth: 340 }}>
        <Inp label="IDENTIFIANT" value={uid} onChange={v => { setU(v); setE(""); }} ph="Votre ID" />
        <div onKeyDown={e => { if (e.key === "Enter") go(); }}>
          <Inp label="MOT DE PASSE" value={pw} onChange={v => { setP(v); setE(""); }} type="password" ph="Mot de passe" />
        </div>
        {err && <p style={{ color: Z.r, fontSize: 12, margin: "-4px 0 8px" }}>{err}</p>}
        <Btn onClick={go} color={BC} full>Se connecter</Btn>
        <div style={{ textAlign: "center", marginTop: 12, fontSize: 10, color: Z.d }}>{total} utilisateur(s)</div>
        {total <= 1 && (
          <Cd s={{ marginTop: 14, padding: 14, background: Z.a + "08", border: "1px solid " + Z.a + "18" }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: Z.a, marginBottom: 6 }}>🏁 Premier démarrage</div>
            <div style={{ fontSize: 11, color: Z.m }}>Connectez-vous Admin pour configurer :</div>
            <div style={{ fontSize: 12, fontWeight: 700, color: Z.w, marginTop: 6, fontFamily: "monospace" }}>ID: ADM001 • MDP: admin2026</div>
          </Cd>
        )}
        {!getApiKey() && (
          <Cd s={{ marginTop: 10, padding: 14, background: Z.r + "08", border: "1px solid " + Z.r + "18" }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: Z.r }}>⚠️ Clé API non configurée</div>
            <div style={{ fontSize: 10, color: Z.m, marginTop: 4 }}>Connectez-vous Admin → ⚙️ Configuration API</div>
          </Cd>
        )}
        {getApiKey() && (
          <Cd s={{ marginTop: 10, padding: 10 }}>
            <div style={{ fontSize: 11, color: Z.g, fontWeight: 700 }}>🟢 API configurée — Prêt</div>
          </Cd>
        )}
      </div>
    </div>
  );
};

// ═══ MAIN ═══
function App() {
  const [db, _setDB] = useState(loadDB);
  const [cur, setCur] = useState(null);

  const setDB = useCallback((updater) => {
    _setDB(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveDB(next);
      return next;
    });
  }, []);

  const out = () => setCur(null);

  if (!cur) return <LoginP db={db} onIn={setCur} />;
  if (cur.role === "student") return <StudentP user={cur} onOut={out} />;
  if (cur.role === "parent") return <ParentP user={cur} db={db} onOut={out} />;
  if (cur.role === "teacher") return <TeacherP user={cur} db={db} setDB={setDB} onOut={out} />;
  if (cur.role === "admin") return <AdminP user={cur} db={db} setDB={setDB} onOut={out} />;
  return null;
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
